name: "iCTF 2005 — E-Store (estore)"
author: "Giovanni Vigna / UCSB Security Lab"
category: web
description: |
  **iCTF 2005 — The Bass Tard Corporation**

  The Bass Tard Corporation's e-commerce platform. Users can register accounts,
  log in, browse products, and update profile information. The flag is stored
  as a product entry in the `estore` MySQL database, accessible only to
  authenticated users. Service exposes CGI scripts at `/~estore/cgi-bin/`.

  ## Vulnerability

  `process_login.php` sanitizes `username` but **not** `password`:
  ```php
  $username = mysql_real_escape_string($_GET['username']);
  $password = $_GET['password'];  // raw!
  ...
  "SELECT * FROM users WHERE username='${username}' AND password='${password}'"
  ```
  Classic SQL injection: `password=' OR '1'='1` bypasses authentication.
  Cookie format is `username:password:expiration:token` — credentials in cleartext.
  Database: MySQL `estore` as `estoreuser:retard`.

  ## Source

  Extracted from competition VM (`/home/estore/public_html/cgi-bin/`):
  PHP4 CGI scripts: `login.php`, `process_login.php`, `createuser.php`,
  `process_createuser.php`, `buy.php`, `process_buy.php`, `sell.php`,
  `process_sell.php`, `update.php`, `process_update.php`, `logout.php`,
  `process_logout.php`, `myfuncs.php`, `debug.php`, `info.php`.
