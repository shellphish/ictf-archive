description: |
  **iCTF 2005 — The Bass Tard Corporation**

  The Bass Tard Corporation's public guestbook service. Visitors can post
  comments; the flag is stored as a private message in a user's guestbook entry.
  The scorebot accessed entries at `/~guestbook/cgi-bin/guestbook.pl?user=<first>`
  and posted new flags via an HTML form on `feedback.html`.
