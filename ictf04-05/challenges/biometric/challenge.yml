name: "iCTF 2005 — Biometric File Service (biometric)"
author: "Giovanni Vigna / UCSB Security Lab"
category: binary
description: |
  **iCTF 2005 — The Bass Tard Corporation**

  A C network service that provides authenticated file query and storage.
  It presents an HTTP-like interface with endpoints for `/query` (retrieve
  a file by name) and `/store` (save file content). User identity is
  passed as a hidden field. Find the vulnerability.
