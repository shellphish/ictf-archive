name: "iCTF 2004-05 — Silly Auth Server (sillyd)"
author: "Giovanni Vigna, UCSB"
category: binary
description: |
  **iCTF 2004-05 — The Bass Tard Corporation**

  `sillyd` is a C authentication daemon listening on TCP port 12345.
  It issues random 31-character auth tokens (stored as flat files under
  `data/`) and verifies them with REG/AUTH/REVOKE commands.

  Protocol:
  ```
  REG    <secretID>   => +REG <auth token>
  AUTH   <auth token> => +AUTH <secretID>
  REVOKE <auth token> => +REVOKE
  PING   <num>        => +PONG
  ```

  Two documented vulnerabilities (see `src/sillyd.txt`):

  1. **Command injection via AUTH** — If the auth token is valid but
     long enough that `id` and `cmdbuf` merge into a single string, the
     call to `grep` via `system()` will see extra shell arguments. Exploit
     to inject shell commands along with the token match.

  2. **PING buffer overflow** — The PING handler passes a `char*` as an
     `int*` to store the ping count. This corrupts the `bp` variable (the
     remaining `read()` size), allowing a crafted PING (without `\r\n`
     terminator) to grow the read buffer and overflow `cmdbuf` (2342 bytes)
     on the next read.

  Run: `cd sillyd_dir && mkdir data && ./sillyd &`
value: 0
type: standard
image: "."
protocol: tcp
port: 12345
flags:
    - ictf0405{sillyd_compromised}
topics:
