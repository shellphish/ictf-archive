name: "iCTF 2005 — Contact Directory (contact)"
author: "Giovanni Vigna / UCSB Security Lab"
category: web
description: |
  **iCTF 2005 — The Bass Tard Corporation**

  The Bass Tard Corporation's internal contact/phone directory. Contacts have
  a first name, last name, and extension field. The scorebot stored the flag
  as a contact's extension, updated via a Perl CGI.

  ## Vulnerabilities

  `contact_query.pl` evaluates `/home/contact/init.pl` if it exists (`eval \`cat ${init_file}\``),
  allowing arbitrary Perl execution via file write. The `$debug` parameter also
  triggers `` `${identity}` `` (shell exec of whatever `$identity` is set to).

  `contact_change.pl` accepts admin credentials and runs unsanitized SQL:
  ```perl
  $sth = $dbh->prepare("UPDATE employees SET extension='$ext' WHERE last='$last' AND first='$first';");
  ```
  `$last` and `$first` are unescaped → SQL injection. Admin password MD5:
  `HRI7PFYDuH/YThpIugvtbA` (base64 MD5).

  ## Source

  Extracted from competition VM (`/home/contact/public_html/cgi-bin/`):
  - `src/contact_query.pl` — query endpoint; MySQL `corpdb` as `corpdbuser/basstard`
  - `src/contact_change.pl` — admin update endpoint; SQL injection in last/first params
