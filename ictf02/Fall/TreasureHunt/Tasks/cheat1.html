    <h1>Trasure Hunt - Cheat Sheet 1</h1>

    <p>The firewall will drop scan packets causing long delays in portscans.
    Use a "horizontal" approach were you first try to ping all the hosts
    (maybe using TCP) and then focus only on the hosts that respond to the
    query.</p>
