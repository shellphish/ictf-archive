name: transaction
author: iCTF Organizers
description: |
  The payroll transaction server listens on port 7979.
  Connect and type HELP to see the available commands.
  The PAYCHECK command reads the password with gets() and then
  passes it directly to printf(). The FILE command runs cat on
  whatever you give it. Three paths to code execution — pick your favorite.
