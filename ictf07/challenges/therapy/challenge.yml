name: "iCTF 2007 — Copyright Mafia: Therapy"
author: "Giovanni Vigna / UCSB Security Lab"
category: web
description: |
  **iCTF 2007 — The Copyright Mafia**

  Even Mafia members need mental health services. The therapy service
  provides counseling for Mafia operatives — clients submit complaints
  against counselors; counselors manage case notes.

  ## Architecture

  - **Frontend:** PHP redirect (`therapy.php`) on port 80, immediately
    redirects to Tomcat on port 8080 (`/Therapy/`)
  - **Backend:** Apache Tomcat 6.0.14 running `Therapy.war` (Java servlet)
  - **Database:** MySQL `psycho` / user `psycho` / password `psycho`
  - Two roles: `client` and `counselor` (stored in `role` ENUM column)

  ## Flag mechanism

  The flag is stored in the `private_info` column of the `users` table:
  ```sql
  private_info varchar(128)   -- FLAG STORAGE
  ```
  The scorebot creates a counselor with the flag in `private_info`;
  only counselors can read each other's private info.

  ## Java source (Therapy.war — Tomcat 6.0.14)

  Full Java source files are in `src/java/WEB-INF/classes/`:
  - `psycho/` — `ActionController.java`, `ApplicationResources.java`, `RequestHelper.java`
  - `psycho/users/` — `AccountManager.java`, `ClientManager.java`, `CreateUser.java`, `User.java`
  - `psycho/utils/` — `Command.java`, `DatabaseHelper.java`
  - `org/apache/jsp/` — compiled JSP source: login, menu, index, clients, counselor,
    complain, newcomplain, newuser, error pages

  Note: `therapy-src.jar.gpg` on the VM was GPG-encrypted (key unknown);
  however, the `Therapy.war` file itself contains both `.class` and `.java` source files.

  ## Vulnerability hints

  - `DatabaseHelper.java` uses `PreparedStatement` for most queries, but
    certain path parameters may be concatenated into SQL strings
  - Client-counselor assignment allows lateral access to another user's `private_info`
  - Session management in `RequestHelper.java` — cookie forgery possible?
  - Role escalation: client → counselor via account update path

