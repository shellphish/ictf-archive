{% extends "base.html" %}

{% block content %}
  {% if form.errors %}
    <p class="errornote">Please correct the following error{{ form.error_dict|pluralize }}!</p>
  {% endif %}

  <form method="post" action="." enctype="multipart/form-data">
    <table>
    {{ form.as_p }}
    </table>
    <input type="submit"/>
  </form>


{% endblock %}
