{% extends "base.html" %}

{% block content %}

  <div class="figure-left">
      <img width="90" height="90" src="{{ boss.get_image_url }}"/> 
  </div>

 <p><br/>
    {{ boss.name }}<br/>
    <br/><br/><br/></p>

  <h2>Contracted Artists</h2>

  {% ifequal boss.protection_set.count 0 %}
    No managed artist yet.
  {% else %}
    <ul>

    {% for p in boss.protection_set.iterator %}
       <li>{{ p.artist.name }}</li> 
    {% endfor %}

    </ul>

  {% endifequal %}

{% endblock %}
