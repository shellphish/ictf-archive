name: "iCTF 2007 — Copyright Mafia: Make Amends"
author: "Giovanni Vigna / UCSB Security Lab"
category: web
description: |
  **iCTF 2007 — The Copyright Mafia**

  The Mafia offers a forgiveness service: wrongdoers can "make amends" by
  paying cash settlements to copyright holders. The service processes
  payment agreements and generates legal letters (PDF and plain text).
  Find a vulnerability in the PHP application and compromise the amends system.

  ## Source (extracted from Ubuntu VM, mafia2007.vmwarevm snapshot Dec 2007)

  - `src/cgi-bin/amends.php` — main CGI entrypoint
  - `src/cgi-bin/chaching.php` — payment processing
  - `src/cgi-bin/ltr.php` — letter generation dispatcher
  - `src/cgi-bin/payoff.php` — payoff calculation
  - `src/cgi-bin/settlement.php` — settlement workflow
  - `src/php-include/cookie.php`, `dbconfig.php`, `dblogin.php`, `filter.php`, `id.php`, `pagegen.php` — shared libraries
  - `src/ltrpdf.inc` — PDF letter template
  - `src/ltrtxt.inc` — plain-text letter template
  - `src/index.html` — static front page

