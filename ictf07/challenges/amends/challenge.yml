description: |
  **iCTF 2007 — The Copyright Mafia**

  The Mafia offers a forgiveness service: wrongdoers can "make amends" by
  paying cash settlements to copyright holders. The service processes
  payment agreements and generates legal letters. Find a vulnerability in
  the PHP application and compromise the amends system.
