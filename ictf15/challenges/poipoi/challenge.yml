description: |
  **iCTF 2015 — Crowdsourcing Evil**

  Uranium mining is the process of extracting uranium ore from the ground. A prominent use of uranium from mining is as fuel for nuclear weapons. The POIPOI service collects information of all uranium mines in the world, so if you know of some new mines please insert related locations as soon as you can and help your country to dominate the world!

  **Flag ID:** The flag_id is the user_id returned by the server after successful registration.

  Port: 3335. Source not available (only competition database and base VM preserved).
  This service was reused from an earlier iCTF edition or submitted by teams for ictf15.
