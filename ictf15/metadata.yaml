    individual_challenges: false

resources:
  website: "https://ictf.cs.ucsb.edu/archive/2015/site"

notes: >
  The 2015 iCTF was themed "Crowdsourcing Evil." With 42 services per team,
  it was one of the largest iCTF editions in terms of service count. Many services
  were reused from earlier editions (ictf04 through ictf13), creating a "greatest
  hits" competition. The full competition database is preserved in
  database/last_db.sql.xz (98 MB). Organizer materials (working notes, service vote
  spreadsheet, team location data) are also preserved. A C++ integer overflow
  writeup (notecxx_writeup.md) by team DCIETS is included.
