edition: ictf23
year: 2023
title: "AI and Cybersecurity"

format: jeopardy
# Two parallel tracks: High School and Undergraduate.
# CTFd-based, hosted December 2023.
# Sponsored by the NSF AI ACTION Institute.
# Organized jointly by WiCS (Women in Computer Science) and Shellphish.

dates:
  start: "2023-12-02"
  end: "2023-12-08"
  # From CTFd config: start 1701540000 (2023-12-02 18:00 UTC),
  # end 1702080000 (2023-12-09 00:00 UTC).

participation:
  num_teams: null
  undergraduate_users: 39
  highschool_users: 13
  notes: >
    Two parallel tracks. Undergraduate: ~39 registered users.
    High School: ~13 registered users. Team mode may have been used;
    users count is approximate.

data:
  - type: ctfd-export
    path: "CTFd_Archive/iCTF 2023 - Undergraduate - Competition.2023-12-21_16_58_41.zip"
    description: "Full CTFd export: undergraduate track (challenges, flags, submissions, files)"

  - type: ctfd-export
    path: "CTFd_Archive/iCTF 2023 - High School - Competition.2023-12-21_17_01_03.zip"
    description: "Full CTFd export: high school track (challenges, flags, submissions, files)"

  - type: other
    path: "CTFd_Archive/iCTF 2023 - Undergraduate - Scoreboard.pdf"
    description: "Final scoreboard PDF: undergraduate track"

  - type: other
    path: "CTFd_Archive/iCTF 2023 - High School - Scoreboard.pdf"
    description: "Final scoreboard PDF: high school track"

  - type: other
    path: "CTFd_Archive/iCTF 2023 - Undergraduate - Challenges.pdf"
    description: "Challenge listing PDF: undergraduate track"

  - type: other
    path: "CTFd_Archive/iCTF 2023 - High School - Challenges.pdf"
    description: "Challenge listing PDF: high school track"

infrastructure:
  scorebot: "ctfd"
  docker:
    full_environment: false
    individual_challenges: true
    notes: "Some challenges (e.g., rustyneurone, supermart) include Docker images in CTFd uploads."

resources:
  github: "https://github.com/shellphish/ictf23"
  website: "https://ictf.cs.ucsb.edu"
  sponsor: "NSF AI ACTION Institute"

notes: >
  The 2023 iCTF focused on AI and cybersecurity at the intersection of two
  rapidly evolving fields. It was the first iCTF to run two parallel tracks
  (High School and Undergraduate) with different difficulty levels. Categories
  included a novel "LLM" category for prompt-injection and LLM-exploitation
  challenges, alongside traditional pwn, reverse engineering, crypto, forensics,
  and data science. Organized by WiCS (Women in Computer Science) at UCSB and
  Shellphish, with NSF AI ACTION Institute sponsorship. Full CTFd exports are
  preserved locally including all challenge files, flags, and submissions.

