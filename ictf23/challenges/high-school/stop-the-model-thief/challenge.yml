name: "Stop the model thief!"
author: "iCTF 2023 organizers"
category: data science
description: |
  An attacker can send exactly the same image multiple times to a machine learning system to exhaust its resources. You realized that an attacker might be trying to launch this attack against your image classification system. You're given two files - [1::model_queries.npy] a list of images that your model received as inputs and [2::user_query_indices.txt] a list of image indices (starts from zero) in [1] sent to your model by each user-id. In [2], each line contains the indices from a different user-id (e.g., the very first line is user-id 0, the second line is user-id 1). Can you help us find the attacker's user-id(s)? Note:: if there were 4 attacker user-ids (e.g., 82,54,13,36), the flag will be 'ictf{13,36,54,82}' (sorted, no quotes).
value: 500
type: dynamic

image: null
protocol: null
host: null
connection_info: null

flags:
    - ictf{27,30,37,61,66,67,172,233,243,244,249,266,290,341,379,428,439,466,488,517}

topics:
    - document misc

tags:
    - adversarial learning
    - ml security

files:
    - attachments/model_queries.npy
    - attachments/user_query_indices.txt

hints:
    - {content: "This is a smart attacker. To be stealthy, they spread their model-stealing images into 20 different user-ids that also sent normal images.", cost: 10}
    - {content: "You can take the hash of the image which assign each image to a unique identifier. Then look at which hashes are repeated multiple times in the images.", cost: 20}
    - {content: "We know that each attacker user-id has sent at least 5 near-duplicate attack images.", cost: 20}

state: hidden
