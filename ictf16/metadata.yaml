edition: ictf16
year: 2017
title: "Shell We Play a Game?"
game_theme: "Unicorns, Ponies, and Rainbows vs. Artificial Intelligence"

format: attack-defense
# Note: Organized in 2016, run March 3–4, 2017.
# Joint UCSB (Shellphish) + ASU (SEFCOM) organization.
# First iCTF as a DEF CON CTF qualifier.

dates:
  start: "2017-03-03"
  end: "2017-03-04"
  # Competition ran 24 hours: March 3, 2017 9am PST to March 4, 2017 9am PST
  # Ended prematurely at 4:15am due to DDoS.

participation:
  num_teams: 314
  notes: >
    314 teams (confirmed from CTFtime.org event 439). First iCTF open to all
    teams (not just academic). First iCTF hosted on Amazon Web Services (AWS).
    First iCTF as a DEF CON CTF qualifier. Joint UCSB (Shellphish) +
    ASU (SEFCOM) organization. Winner: Bushwhackers. LC/BC disqualified for DDoS.

results:
  winner: "Bushwhackers (Russia)"
  final_scoreboard:
    - {rank: 1,  team: "Bushwhackers",      score: 2849008, rating_pts: 100.000}
    - {rank: 2,  team: "dcua",              score: 2731034, rating_pts:  72.464}
    - {rank: 3,  team: "WE_0WN_Y0U",        score: 2690745, rating_pts:  58.036}
    - {rank: 4,  team: "CodiSec",           score: 2461093, rating_pts:  49.444}
    - {rank: 5,  team: "Tower of Hanoi",    score: 2380726, rating_pts:  43.478}
    - {rank: 6,  team: "saarsec",           score: 2326395, rating_pts:  39.130}
    - {rank: 7,  team: "SiBears",           score: 2251127, rating_pts:  35.775}
    - {rank: 8,  team: "217",               score: 2199893, rating_pts:  33.333}
    - {rank: 9,  team: "LosFuzzys",         score: 2106046, rating_pts:  31.159}
    - {rank: 10, team: "HackingForSoju",    score: 2062891, rating_pts:  29.348}
  notes: >
    Source: CTFtime.org event 439. Bushwhackers won with 2,849,008 points.
    LC/BC launched a DDoS attack via botnet on compromised team VMs at 4:15am,
    bringing down the competition network. Bushwhackers were declared winners
    (barely ahead at time of DDoS). LC/BC was disqualified.
    CTFtime weight: 62.63 (high-prestige event).

challenges:
  # 12 services on ports 20001-20012. Only 2 names confirmed.
  - name: flasking_unicorns
    title: "Flasking Unicorns"
    category: web
    description: >
      Flask web service with a Server-Side Template Injection (SSTI) vulnerability
      at the /nice_try endpoint. Confirmed from DDoS post-mortem: LC/BC used this
      vulnerability to install a backdoor on team VMs during the competition,
      then pivoted to DDoS Bushwhackers. Flask Jinja2 SSTI via Python 2.7 eval.
      Service logs were used as evidence in the DDoS forensic analysis.

  - name: turing_award
    title: "Turing Award"
    category: binary
    description: >
      Service at port 20006. Name confirmed from an editor's note in the DDoS
      forensic analysis (DDOS.md): the smoking-gun DDoS payload connected to
      "2887745995" (172.31.129.203 = Bushwhackers, team 203) on port 20006, with
      the comment "# EDITOR'S NOTE: turing_award@bushwhackers". Nature of the
      service not otherwise documented in the archive.

data:
  - type: other
    path: "iCTF 2016 Planning.docx"
    description: "Organizer planning document (from fall 2016)"

  - type: other
    path: "iCTF 2016-2017 Announcement.docx"
    description: "Official competition announcement (theme, rules, format)"

  - type: other
    path: "Reply to LCBC.docx"
    description: "Organizer response to LC/BC controversy post-competition"

infrastructure:
  scorebot: "ictf-framework"
  network: >
    AWS-hosted /17 network (172.31.128.0/17). Each team received one VM.
    Team VMs: 172.31.129.TEAM_ID (IDs <255) or 172.31.130.(TEAM_ID-254).
    Traffic masqueraded/anonymized through central router.
    Service ports: 20001-20012.
  docker:
    full_environment: false
    individual_challenges: false

resources:
  website: "https://ictf.cs.ucsb.edu/archive/2016-2017/website"
  ctftime: "https://ctftime.org/event/439"

notes: >
  The 2016-2017 iCTF ran March 3–4, 2017 from 9am to 9am PST (24 hours).
  Official title: "Shell We Play a Game?" Game theme: "Unicorns, Ponies, and
  Rainbows vs. Artificial Intelligence." First joint UCSB (Shellphish) +
  ASU (SEFCOM) iCTF. First iCTF open to all teams (not just academic) and
  first hosted on AWS. First iCTF as DEF CON CTF qualifier. With 300+ teams
  it was one of the largest online attack-defense CTFs ever run. The competition
  ended prematurely when second-place team LC/BC launched a DDoS attack via a
  botnet installed on compromised team VMs, bringing down the competition
  network at 4:15am. Bushwhackers (barely ahead) were declared winners.
  LC/BC was disqualified. The organizers published a detailed forensic analysis
  (in attic/ictf-website). The local archive is minimal (30 KB).
