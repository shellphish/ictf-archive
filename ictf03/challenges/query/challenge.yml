name: "iCTF 2003 — query"
author: "Giovanni Vigna, UCSB"
category: web
description: |
  **iCTF 2003 — Windows Goes Open-Source**

  query was a Perl CGI telephone directory service. Flags were stored
  as directory entries and retrieved via HTTP queries.

  ## Architecture

  - Flag stored as an entry for "Bill Gates" with flag as the record ID
  - Admin update: `GET /cgi-bin/change.pl?login=admin&password=<pw>&last=Gates&first=Bill&id=<flag>`

  ## Vulnerability

  The `change.pl` CGI script accepted unsanitized parameters in a GET
  request. Classic Perl CGI parameter injection or SQL injection likely.

  ## Vulnerability

  The search CGI (`query_extension.pl`) sanitizes with `s/[^a-zA-Z]//g`,
  stripping non-alpha characters — but `change.pl` accepts admin credentials
  in a GET request. The admin password (`##QUERY_DB_PASS##` placeholder)
  is embedded in the CGI source. The SQL query uses string interpolation:
  `WHERE last = '$cboname'` — sanitized via regex, but `change.pl` may
  not sanitize its inputs, allowing unauthorized flag updates.

  ## Source

  Source extracted from CTF VM (RedHat 9 VMware image, `/root/setup/query/`):

  - `src/query_extension.pl` — Perl CGI phone directory search; connects to
    PostgreSQL `querydb` as `queryuser`, lists all employees or filters by
    last name; flag is the `id` field of the "Bill Gates" row
  - `src/change.pl` — admin CGI to update an employee record (last, first, id)
  - `src/get_query`, `src/set_query` — scorebot interaction scripts
  - `src/setup.sh`, `src/init_query`, `src/init.sh` — deployment scripts
