name: "iCTF 2003 — sfind"
author: "Giovanni Vigna / UCSB Security Lab"
category: pwn
description: |
  **iCTF 2003 — Windows Goes Open-Source**

  sfind was a custom file-search service. Clients sent line-delimited
  requests specifying search parameters; the service ran file searches
  and returned matching results. Flags were stored as keywords in
  searchable files.

  ## Protocol

  Text-based TCP protocol (via `sfindc` helper):
  ```
  id <num>
  user <username>
  password <password>
  filename <glob>
  keyword <searchterm>
  environ <VAR=value>
  ```

  ## Vulnerability

  Two confirmed vulnerabilities (from source, extracted from CTF VM):

  1. **Command injection**: The `keyword` field is passed unquoted to `system()`:
     ```c
     sprintf(cmd, "find %s -name \"%s\" -exec grep -H -n %s \\{\\} \\; > %s",
             init_cwd, filename, keyword, outf);
     system(cmd);
     ```
     Injecting shell metacharacters in `keyword` (e.g., `foo; cat /etc/passwd`)
     executes arbitrary commands.

  2. **Environment variable injection**: The `environ` command sets environment
     variables via `putenv()` before the `find` exec, allowing `LD_PRELOAD`
     injection or similar attacks.

  ## Source

  Source extracted from CTF VM (RedHat 9 VMware image).

  - `src/sfind.c` — final deployed server (has hardcoded flag/password placeholders)
  - `src/weirdfind.c` — earlier development version (same logic)
  - `src/weirdfindc.c` — earlier version of the client
  - `src/encode.c` — flag/password encoding utility
  - `src/setup.sh` — deployment script
  - `src/get_sfind`, `src/set_sfind` — scorebot scripts (use `sfindc` binary)
  - `src/init_sfind` — service init script

  The flag filename is XOR-encoded in `flagname_encoded[]` (decoded: `" !"` minus 8, 9, 10).
  The `BYPASSWORD` constant `"XXGvWEuD1BDMI"` is the service auth bypass password.
