# Servlet settings

# General stuff
SCRIPTSDIR=/root/scripts

# Tomcat stuff
export JAVA_HOME=/usr/java/j2sdk1.4.2_02
TOMCAT_HOME=/usr/local/jakarta-tomcat-4.1.29
TOMCAT_BIN=$TOMCAT_HOME/bin
TOMCAT_START=$TOMCAT_BIN/startup.sh
TOMCAT_STOP=$TOMCAT_BIN/shutdown.sh

# Ant stuff
ANT_HOME=/usr/local/apache-ant-1.5.4
ANT_BIN=$ANT_HOME/bin
ANT=$ANT_BIN/ant

# Webapp stuff
WEBAPPPKG=`pwd`/webapp.tgz
WEBAPPINSTDIR=/usr/local/src
WEBAPPDIR=$WEBAPPINSTDIR/webapp
WEBAPPSRCDIR=$WEBAPPDIR/src
WEBAPPTMPLDIR=`pwd`/tmpl
WEBAPPWAR=$WEBAPPDIR/dist/search-0.1.war
WEBAPPHTDIR=/var/www/html/servlet

# Database stuff
SERVLET_DBNAME=kb
SERVLET_DBUSER=kb
SERVLET_DBSQL=$WEBAPPDIR/kb.sql

