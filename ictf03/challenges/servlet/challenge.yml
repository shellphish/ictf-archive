name: "iCTF 2003 — servlet"
author: "Giovanni Vigna, UCSB"
category: web
description: |
  **iCTF 2003 — Windows Goes Open-Source**

  servlet was a Java servlet service. Teams stored flags in the servlet and
  the scorebot retrieved them using HTTP GET/POST requests to the servlet
  endpoint. The "Windows Goes Open-Source" theme involved services that
  mimicked Windows functionality reimplemented as open-source software.

  ## Scorebot interaction

  - `setflag-servlet`: POST to the servlet endpoint to store a flag
  - `getflag-servlet`: GET from the servlet endpoint to retrieve the flag

  ## Architecture

  Java servlet (`ctf` package) running under Tomcat 4.1.29. Apache proxies
  `/search/*` to Tomcat via mod_jk (`JKMount /search/* search`). The servlet
  responds to `/search/search?action=doSearch&keywords=NSA` (GET flag) and
  `/search/admin?action=doLogin` + `action=updateArticle` (set flag, port 8080).

  ## Source

  Source extracted from CTF VM (RedHat 9 VMware image, `/root/setup/servlet/tmpl/`):

  - `src/webapp/src/ctf/Search.java` — search servlet (GET /search/search)
  - `src/webapp/src/ctf/Admin.java` — admin auth/article management (GET/POST /search/admin)
  - `src/webapp/src/ctf/Database.java` — PostgreSQL database access layer
  - `src/webapp/src/ctf/Page.java` — HTML page generation helpers
  - `src/webapp/web/WEB-INF/web.xml` — servlet configuration
  - `src/webapp/build.xml` — Ant build script (targets: compile, install, deploy)
  - `src/webapp.tgz` — original archive including web assets (CSS, images, JS)
  - `src/getflag-servlet`, `src/setflag-servlet` — scorebot interaction scripts
  - `src/setup.sh`, `src/init_servlet`, `src/transform` — deployment scripts

  The webapp is "BassTard Support Forum" — two servlets: `ctf.Search` (/search)
  and `ctf.Admin` (/admin). Deployed under Tomcat 4.1.29 at `/search` context.
  Uses PostgreSQL (via postgresql.jar).
