edition: ictf03
year: 2003
title: "Windows Goes Open-Source"

format: attack-defense

dates:
  start: "2003-12-01"
  end: "2003-12-31"
  # Two rounds in 2003: November (20031114) and December (20031205)

participation:
  num_teams: 13
  countries: [US]
  notes: >
    13 teams from US universities. Some schools fielded more than one team.
    Universities: UC Santa Barbara, North Carolina State University,
    Naval Postgraduate School (Monterey), West Point, Georgia Tech,
    University of Texas at Austin, University of Illinois Urbana-Champaign.

results:
  # From scorebot.state (December 5, 2003 round)
  winner: "Whitehat — 11245 points"
  final_scoreboard:
    - {rank: 1, team: "Whitehat", score: 11245}
    - {rank: 2, team: "Donbehatin", score: 7550}
    - {rank: 3, team: "Open Kiosk", score: 6960}
    - {rank: 4, team: "Ishan Shade", score: 6080}
    - {rank: 5, team: "Wolfpack", score: 6275}
    - {rank: 6, team: "Wujing", score: 5850}
    - {rank: 7, team: "0x90", score: 5560}
    - {rank: 8, team: "Nebuchadnezzar", score: 5115}
    - {rank: 9, team: "Shrek", score: 4115}
    - {rank: 10, team: "Generic Tigers", score: 3965}
    - {rank: 11, team: "jmp esp", score: 3125}
    - {rank: 12, team: "UTexas", score: 2680}
    - {rank: 13, team: "Argus", score: 2170}

challenges: []
# Services hosted on VM images (available in vms/).

data:
  - type: scorebot
    path: "data/scorebot/"
    description: >
      Original scorebot data: scorebot.conf (service definitions),
      scorebot.state (final team scores + flag states), and scripts/
      directory with flag set/get scripts for all 6 services.

  - type: other
    path: "site/"
    description: "Original competition website"

  - type: pcap
    path: "dumps/"
    description: "Network traffic captures from competition"

  - type: vm_image
    path: "vms/"
    description: "Virtual machine images for competition services"

  - type: media
    path: "pictures/"
    description: "Event photographs"

  - type: other
    path: "20031114_CTF/"
    description: "November 2003 round data"

  - type: other
    path: "20031205_CTF/"
    description: "December 2003 round data"

infrastructure:
  scorebot: "custom"
  network: "Multiple team networks"
  docker:
    full_environment: false
    individual_challenges: false

resources:
  website: "https://ictf.cs.ucsb.edu/archive/2003/site"

notes: >
  The 2003 iCTF was the first edition to involve institutions other than
  UC Santa Barbara. Fourteen teams from around the United States competed.
  The theme was the (fictitious) announcement that Microsoft Windows was going
  open-source — teams competed in an attack-defense format centered around
  services related to this premise. Two rounds are present in the archive:
  a November 14, 2003 round and a December 5, 2003 round.
