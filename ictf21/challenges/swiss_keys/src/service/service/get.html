<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script type="text/javascript" src="web/script.js" defer></script>
    <link rel="stylesheet" type="text/css" href="web/style.css">
    <link rel="icon" type="image/png" href="web/logo.png">
    <title>Swiss Keys</title>
  </head>
  <body>
    <header>
      <a id="title" href="index.html">
        <img id="icon" src="web/logo.svg" />
        Swiss Keys
      </a>
      <div id="links">
        <a href="new.html">Create</a> &bull;
        <a href="get.html">Retrieve</a> &bull;
        <a href="set.html">Update</a>
      </div>
    </header>
    <content>
      <h1>Retrieve a Keypair</h1>
      <form id="src" action="get">
        <div class="message"></div>
        <label>
          <span>Address</span>
          <input name="address" type="text" pattern="0x[0-9a-fA-F]{40}" required />
        </label>
        <label>
          <span>Password</span>
          <input name="password" type="password" required />
        </label>
        <label>
          <span>Version</span>
          <input name="version" type="number" min="1" placeholder="latest" />
        </label>
        <input type="submit" value="Retrieve" />
      </form>
      <form id="dst" style="display:none">
        <div class="message"></div>
        <label>
          <span>Address</span>
          <input name="address" type="text" readonly />
        </label>
        <label>
          <span>Comment</span>
          <input name="comment" type="text" readonly />
        </label>
        <label>
          <span>Version</span>
          <input name="version" type="number" readonly />
        </label>
        <label>
          <span>Public Key</span>
          <textarea name="public-key" type="text" readonly></textarea>
        </label>
        <label>
          <span>Private Key</span>
          <textarea name="secret-key" type="text" readonly></textarea>
        </label>
      </form>
    </content>
  </body>
</html>
