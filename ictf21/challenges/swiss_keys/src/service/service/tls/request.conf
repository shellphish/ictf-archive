# Cleaned up a bit from this StackOverflow post:
# https://stackoverflow.com/questions/10175812/how-to-generate-a-self-signed-ssl-certificate-using-openssl
# openssl req -config request.conf -new -x509 -sha256 -newkey rsa:1024 -nodes -keyout key.pem -days 365 -out cert.pem -subj "/C=CH/ST=Valais/L=Sion/O=Swiss Keys/CN=Swiss Keys Web Storage"


[ req ]
default_bits           = 1024
default_keyfile        = key.pem
distinguished_name     = subject
req_extensions         = req_ext
x509_extensions        = x509_ext
string_mask            = utf8only

[ subject ]
# This all seems to be ignored...
C            = CH
ST           = Valais
L            = Sion
O            = Swiss Keys
CN           = Swiss Keys Web Storage

[ x509_ext ]
subjectKeyIdentifier   = hash
authorityKeyIdentifier = keyid,issuer
basicConstraints       = CA:FALSE
keyUsage               = digitalSignature,keyEncipherment
subjectAltName         = @alternate_names
extendedKeyUsage       = serverAuth

[ req_ext ]
subjectKeyIdentifier   = hash
basicConstraints       = CA:FALSE
keyUsage               = digitalSignature,keyEncipherment
subjectAltName         = @alternate_names
extendedKeyUsage       = serverAuth

[ alternate_names ]
DNS.1                  = keys.ch
DNS.2                  = www.keys.ch
