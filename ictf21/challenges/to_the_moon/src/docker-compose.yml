version: "3.7"
services:
    to_the_moon:
        build: ./service
        volumes:
            - type: bind
              source: ./service/ro
              target: /home/chall/service/ro
              read_only: true
            - type: bind
              source: ./service/rw
              target: /home/chall/service/rw
            - type: bind
              source: ./service/append
              target: /home/chall/service/append
              #security_opt:
              #- apparmor:unconfined
        ports:
            - "6666:6666"
              #privileged: true
