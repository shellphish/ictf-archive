edition: ictf17
year: 2017
title: "Unicorns, Ponies, and Rainbows vs. AI"
# Note: this edition corresponds to the 2016-2017 school year competition
# that ran March 3-4, 2017. It is the same competition as the DDoS incident.
# See also ictf16/ which has the planning docs for this competition.
# The "Anti-cheating Detection System" docs here were developed for this edition.

format: attack-defense

dates:
  start: "2017-03-03"
  end: "2017-03-04"
  notes: "March 3-4, 2017, 24 hours (ended early due to DDoS)"

participation:
  num_teams: 300
  notes: >
    Over 300 teams. Open to all teams (not just academic). Joint UCSB +
    ASU organization. DEF CON CTF qualifier. Winner: Bushwhackers.
    LC/BC disqualified for DDoS attack.

challenges: []
# Service ports 20001-20012 referenced in DDoS analysis.
# Known service: "flasking_unicorns" (from network traffic in DDoS post).

data:
  - type: other
    path: "description.txt"
    description: "General iCTF competition format description"

  - type: other
    path: "description2.txt"
    description: "Game narrative (National Cyberdefense Corps, Sicilian hackers, ZDI mechanic)"

  - type: other
    path: "Anti-cheating Detection System.docx"
    description: "Anti-cheating detection system documentation (developed post-DDoS)"

  - type: other
    path: "Anti-cheating Detection System-comment.html"
    description: "HTML-exported comments on the anti-cheating detection system"

infrastructure:
  scorebot: "ictf-framework"
  network: >
    AWS-hosted. Joint UCSB (Shellphish) + ASU (SEFCOM) infrastructure.
    Each team received one VM. Service ports 20001-20012.
  docker:
    full_environment: false
    individual_challenges: false

resources:
  website: "https://ictf.cs.ucsb.edu/archive/2016-2017/website"

notes: >
  The 2017 iCTF ("Unicorns, Ponies, and Rainbows vs. Artificial Intelligence")
  ran March 3-4, 2017 and was organized jointly by UCSB Shellphish and ASU
  SEFCOM. It was a DEF CON CTF qualifier and was open to all teams.
  The game used the "National Cyberdefense Corps" narrative with Sicilian
  hackers and the Zebra Dwarf Institution (ZDI) exploit-submission mechanic.
  An anti-cheating system was developed for this edition after years of concerns.
  The competition was disrupted by a DDoS attack from LC/BC (second place);
  Bushwhackers were declared winners and LC/BC was disqualified.
  See ictf16/ for the planning documents (iCTF 2016 Planning.docx,
  iCTF 2016-2017 Announcement.docx, DDoS analysis).
