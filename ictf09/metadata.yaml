edition: ictf09
year: 2009
title: "Know Your Enemy: Rise of the Botnet"

format: attack-defense
# Unusual design: teams created drive-by download attacks against
# simulated browser users, rather than traditional service exploitation.

dates:
  start: "2009-12-04"
  end: "2009-12-04"
  notes: "December 4, 2009 (from IRC log timestamps)"

participation:
  num_teams: 56
  num_participants: 800
  notes: >
    56 teams, more than 800 students. International university teams from
    multiple countries. Teams include ENOFLAG, PPP, RedCops, FluxFingers,
    nibbles, UCLions, ChocolateMakers, Syper, and many others.
    Largest security competition ever performed at the time.

