    Source: scores.pdf from competition site, dated December 13, 2009.

challenges:
  # Browser families (attack targets): 5 families, 13 total versions.
  # Only 4 of the 13 browser versions were successfully exploited.
  # Source: stats.pdf from competition (The 2009 UCSB International CTF).
  # erbrawser = Erlang browser; operla = Perl-based Opera; pyrefox = Python Firefox;
  # jecko = Java Gecko browser; crefox = C-based Firefox/Chrome.
  - name: erlang-browser
    title: "Erlang Browser (erbrawser)"
    category: web
    description: >
      Erlang-based automated web browser (family name: erbrawser).
      Versions 1.0 and 2.0 deployed. erbrawser-1.0 was exploited by 3 teams
      (hackerdom, cinsects, mayhem); erbrawser-2.0 by 1 team (cinsects).
      Attack: drive-by download via Erlang erl_eval injection.

  - name: operla
    title: "Operla Browser (Perl Opera)"
    category: web
    description: >
      Perl-based Opera browser parody (family name: operla).
      Versions 0.1, 0.2, 0.3 deployed. operla-0.3 exploited by 2 teams
      (enoflag, cinsects); operla-0.2 by 2 teams (enoflag, rpisec);
      operla-0.1 not exploited.

  - name: pyrefox
    title: "Pyrefox Browser (Python Firefox)"
    category: web
    description: >
      Python-based Firefox browser parody (family name: pyrefox).
      Versions 0.1 and 1.0 deployed. Neither version was exploited
      during the competition.

  - name: jecko
    title: "Jecko Browser (Java Gecko)"
    category: web
    description: >
      Java-based Gecko rendering engine browser parody (family name: jecko).
      Versions 1.0, 2.0, 3.0 deployed. None were exploited.

  - name: crefox
    title: "CrEFox Browser (C Firefox)"
    category: web
    description: >
      C-based Firefox/Chrome parody browser (family name: crefox).
      Versions 1.0, 2.0, 3.0 deployed. None were exploited.

  - name: robabank
    title: "RobaBank"
    category: web
    description: >
      In-game banking service. Browsers held accounts there; credential theft
      from exploited browsers let teams steal funds (scored as "Mulah").

  - name: madoffunds
    title: "MadoFunds"
    category: misc
    description: >
      In-game currency exchange (Madoff parody). Convert CTF challenge
      "leetness points" (L33tnezz score) to in-game money (Mulah).

  - name: vulnerable-service
    title: "Vulnerable System Service"
    category: binary
    description: >
      Traditional attack-defense service daemon on each team's Linux VM
      (/etc/init.d/vulnerable_system_service).

