    individual_challenges: true  # challenge.yml + README.md created for all 4 known challenges

resources:
  website: "https://ictf.cs.ucsb.edu/archive/2009/site"

notes: >
  The theme of the 2009 iCTF was "Know Your Enemy: Rise of the Botnet."
  Held December 4, 2009. Groundbreaking format: instead of traditional
  server-side services, teams attacked Erlang-based web browser bots.
  Browsers crawled the web, found team sites via an in-game search engine,
  and were exploited via drive-by downloads (main attack: Erlang erl_eval
  injection). A traditional attack-defense service daemon
  (vulnerable_system_service) also ran on each team VM. In-game economy:
  standalone CTF challenges earned "leetness points" redeemable at MadoFunds;
  exploited browser credentials could be used to steal from RobaBank.
  ENOFLAG (TU Berlin) was among the top teams. Archive: ~44 GB PCAPs +
  Windows XP development VM (browsers.tar.gz source not preserved).
