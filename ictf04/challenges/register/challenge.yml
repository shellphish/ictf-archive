description: |
  **iCTF 2004 — The UN Voting System**

  A UN voter registration CGI service (`register.pl`). The Perl CGI script
  registers voters and stores registration data including the flag as the
  voter credential. Find a way to enumerate or retrieve registered voter records.

  ## Source

  - `src/register.pl` — Perl CGI registration handler
  - `src/register.html` — HTML registration form
  - `src/register_bot.py` — scorebot interaction script
  - `src/registerScoringScript.py` — scoring script
