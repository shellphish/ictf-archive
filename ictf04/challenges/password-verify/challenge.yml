name: "iCTF 2004 — UN Voting: Password Verify Daemon"
author: "Giovanni Vigna, UCSB"
category: binary
description: |
  **iCTF 2004 — The UN Voting System**

  A custom TCP password-verification daemon written in C (port 11111).
  The service verifies user-provided passwords against a per-user dictionary
  stored in `userdict/<username>`. The flag is stored as the "password" entry.

  ## Protocol

  Single-line protocol; the daemon forks per connection:
  ```
  STORE <username> <word> <flag>   — store a flag word
  DICT <username> <password>       — verify password & return stored word
  ```

  ## Source

  Full C source:
  - `src/pwdvrfy.c` — daemon source (BUFSIZE 512, MAXWORD 64, fork-per-connection)
  - `src/pwdvrfy` — compiled binary (Linux/i386)
  - `src/pwdvrfy_bot.py` — scorebot interaction script
  - `src/passwordVerifyScoringScript.py` — scoring script

  Key vulnerability: `buffer[BUFSIZE]` read with no bounds check on command
  parsing — classic stack buffer overflow in the `verify_password()` function.
