description: |
  **iCTF 2004 — The UN Voting System**

  A TCP service on port 11111 that implements a simple credential store.
  Protocol: `STORE <name> <flag>\n` to store, `DICT <name>\n` to retrieve.
  Find a vulnerability to read stored flags without knowing the correct name.
