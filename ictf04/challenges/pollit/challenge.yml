name: "iCTF 2004 — UN Voting System (pollit)"
author: "Giovanni Vigna / UCSB Security Lab"
category: web
description: |
  **iCTF 2004 — The 2004 United Nations Vote**

  The iCTF 2004 scenario put teams inside the United Nations during a
  fictional 2014 Security Council vote. The "pollit" service is the
  online voting platform used by member nations.

  The service is a Perl CGI application that handles secure balloting
  for the UN vote. Find a vulnerability to manipulate the vote.
