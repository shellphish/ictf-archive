description: |
  **iCTF 2004 — The UN Voting System**

  The Diebald service (a parody of Diebold voting machines) exposes an admin CGI
  at `/~diebald/cgi-bin/admin`. The scorebot creates a user and assigns a task
  whose value is the flag. Find a way to enumerate or read other teams' tasks.
