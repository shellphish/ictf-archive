name: "iCTF 2004 — UN Voting: Feedback Service"
author: "Shellphish"
category: web
description: |
  **iCTF 2004 — The UN Voting System**

  A public feedback service for UN election candidates. The Perl CGI
  `feedback_message.pl` accepts comments on candidates and stores them in
  per-user files. The PHP page `feedback.php` displays stored feedback.
  The flag is stored as the comment text; find a way to read other teams' flags.

  ## Source

  - `src/feedback_message.pl` — Perl CGI (stores flag in feedback file)
  - `src/feedback.php` — PHP display page
  - `src/feedback_bot.py` — scorebot interaction script
  - `src/feedbackScoringScript.py` — scoring script
