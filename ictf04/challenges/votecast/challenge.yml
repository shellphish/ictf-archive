name: "iCTF 2004 — UN Voting: Votecast"
author: "Shellphish"
category: binary
description: |
  **iCTF 2004 — The UN Voting System**

  A TCP voting service on port 1969. All messages are XOR-encrypted with the
  fixed key `F2654hD4` (defined in the source). The protocol sends a vote
  `!<wwid> <vote>` where the `vote` is the flag, stored in `votes/<wwid>`.

  Full C source available for client, server, and admin:
  - **Server** (`votecastd.c`): fork-per-connection daemon; reads XOR-encrypted
    request, extracts `wwid` and `vote`, stores in `votes/<wwid>`.
  - **Client** (`votecast.c`): XOR-encrypts and sends a vote.
  - **Admin** (`voteadmin.c`): administrative query interface.

  Key vulnerability: `MAXSIZE 512` buffers for `wwid`, `vote`, `logfilename`,
  `cmd` — classic stack buffer overflow. Also: fixed XOR key is trivially
  reversible; `votes/<wwid>` path can be traversed.

  ## Source

  - `src/server/votecastd.c` — voting server daemon
  - `src/client/votecast.c` — voting client
  - `src/admin/voteadmin.c` — admin client
  - `src/votecast_bot.py` — scorebot interaction script
  - `src/votecastScoringScript.py` — scoring script
