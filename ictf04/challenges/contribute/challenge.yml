name: "iCTF 2004 — UN Voting: Campaign Contribution"
author: "Giovanni Vigna / UCSB Security Lab"
category: web
description: |
  **iCTF 2004 — The UN Voting System**

  A campaign donation tracking service at `/~support/cgi-bin/donate.py`.
  Teams could donate UN Secretary-General election funds to candidates
  (Blitzkrieg, Stallone, Schtrappe, Blix, Schmidt). The flag is stored
  as the credit-card number (`cc`) field; donation summaries are exposed
  as `/~support/<cc>.php` pages.

  The Python CGI `donate.py` (extracted from the competition VM) stores
  donations in `donations.bin` and generates per-`cc` result pages using
  unsanitized filenames: `open("../%s.php" % cc, 'w')`. A `cc` value
  containing `../` (filtered only for `/`) can escape the `cgi-bin/`
  directory — enabling path traversal writes and potentially overwriting
  arbitrary PHP files on the server.

  ## Source

  - `src/donate.py` — CGI script (extracted from competition VM at `/home/support/public_html/cgi-bin/`)
  - `src/donate.py.old` — earlier revision with same bug
  - `src/support.html` — donation form page
  - `src/support_bot.py` — scorebot client (how the scorebot stores/retrieves flags)
