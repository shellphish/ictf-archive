global {
   scriptdir  "/home/ctf/ctfi/scripts";
   logfile    "/home/ctf/ctfi/var/scorebot.log";
   tracefile  "/home/ctf/ctfi/var/scorebot.trace";
   pidfile    "/home/ctf/ctfi/var/scorebot.pid";
   statefile  "/home/www/ctf/var/scorebot.state";
   flaglog    "/home/www/ctf/var/scorebot.flaglog";
   secretkey  "70740e7f717b4b1e5ac5c9b78a059db50c61568";
   decaytime   "30.2";
   decayfactor "0.99";
   offensive_fraction_mode  "1";
}

web {
   chroot "/home/www";
   weblog "/home/www/ctf/var/validate.log";
   debug 1;
}

