hints:
    - {content: "Backdoor features are important features that influence the model's outputs. How can you find the most important features for a model?", cost: 20}
    - {content: "The most important features are not always the backdoor triggers. Instead, the triggers are the ones that look like they mean one thing but are actually up to something entirely different. Filter out the naturally important features!", cost: 20}

