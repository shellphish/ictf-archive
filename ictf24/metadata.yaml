edition: ictf24
year: 2024
title: "iCTF 2024"

format: jeopardy
# Two parallel tracks: High School and Undergraduate, plus a Training track.
# CTFd-based. November 2024.

dates:
  start: "2024-11-16"
  end: "2024-11-22"
  # From CTFd config: start 1731780000 (2024-11-16 18:00 UTC),
  # end 1732320000 (2024-11-23 00:00 UTC). ZIPs exported 2024-12-03.

participation:
  num_teams: null
  undergraduate_users: 39
  highschool_users: 27
  notes: >
    Two parallel tracks. Undergraduate: ~39 registered users.
    High School: ~27 registered users. Training track had no registration.

data:
  - type: ctfd-export
    path: "iCTF 2024 Undergraduate Track.2024-12-03_23_52_20.zip"
    description: "Full CTFd export: undergraduate track (challenges, flags, submissions, files, 192 MB)"

  - type: ctfd-export
    path: "iCTF 2024 High School Track.2024-12-03_23_54_35.zip"
    description: "Full CTFd export: high school track (challenges, flags, submissions, files, 104 MB)"

  - type: ctfd-export
    path: "iCTF 2024 - Training Challenges.2024-12-03_23_56_06.zip"
    description: "Training challenge set (subset of ictf23 challenges reused for practice, 38 MB)"

infrastructure:
  scorebot: "ctfd"
  docker:
    full_environment: false
    individual_challenges: true

notes: >
  The 2024 iCTF ran November 16–22, 2024 with two parallel tracks (High School
  and Undergraduate). Categories spanned web, pwn, forensics, machine-learning,
  programming, and misc. The machine-learning category continued the AI theme
  from ictf23 (e.g., encrypted_ai, MysteriousModel, UnmaskTheTrigger —
  adversarial ML and model analysis challenges). A training track (subset of
  ictf23 challenges) was offered for practice. The calabrian_programmer challenge
  name is a nod to Giovanni Vigna's Calabrian heritage. Full CTFd exports are
  preserved locally including all challenge files, flags, and submission data.

