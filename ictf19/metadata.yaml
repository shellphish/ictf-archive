edition: ictf19
year: 2019
title: "The Grey Hat Nation"

format: attack-defense
# ZDI framework: teams defend services + detect attacks + submit exploits.
# No direct inter-team attacking; organizers run exploits on behalf of teams.

dates:
  start: "2019-03-15"
  end: "2019-03-16"
  # March 15, 2019 10:00 UTC — March 16, 2019 10:00 UTC (CTFtime event 762).

participation:
  num_teams: 398
  notes: "398 teams (confirmed from CTFtime.org event 762)."

results:
  winner: "Bushwhackers (Russia)"
  final_scoreboard:
    - {rank: 1, team: "Bushwhackers",  rating_pts: 98.670}
  notes: >
    Source: CTFtime.org event 762. Bushwhackers won with 98.670 rating points.
    Full scoreboard available at CTFtime.

resources:
  ctftime: "https://ctftime.org/event/762"

challenges: []
# Services were "critical infrastructure" services per the CTF specification.
# Full service specification in CTF Service Specification.docx.

data:
  - type: other
    path: "CTF Service Specification.docx"
    description: "Service specification document for challenge authors"

infrastructure:
  scorebot: "custom-zdi-framework"
  network: >
    Each team given a server running critical infrastructure services.
    ZDI (Zebra Dwarf Institution) framework for exploit submission.
    Flow-based attack detection scoring.
    Service availability multiplier.
  docker:
    full_environment: false
    individual_challenges: false

notes: >
  The 2019 iCTF (March 15-16, 2019) continued the ZDI framework from prior
  editions. The narrative: teams are grey-hat operators hired to defend their
  nation's critical services while secretly selling exploits to the Zebra Dwarf
  Institution. 398 teams participated. Winner: Bushwhackers.
  A "CTF Service Specification.docx" is preserved, documenting the
  requirements for service authors. The local archive is minimal (~12 KB).
