edition: ictf14
year: 2015
title: "Large-scale Hacking"

format: attack-defense
# Delayed execution: organized in 2014, run in April 2015.

dates:
  start: "2015-04-01"
  end: "2015-04-30"
  # Announcement says "Thursday" VM delivery, "Friday morning" key release.
  # Exact date not confirmed; April 2015.

participation:
  num_teams: 88
  notes: >
    88 teams (ranks 0–87 in final scoreboard). Winner: SpamAndHex (Hungary).
    International university teams. Each team received a VirtualBox VM as router.
    Winner scored 92.744 with 88 timeliness, 593.037 leetness, 6300 diversity.

challenges: []
# Specific services not documented in local archive.

