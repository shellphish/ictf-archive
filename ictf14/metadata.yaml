  - type: media
    path: "ictf2014_scoreboard_screenshot.png"
    description: "Scoreboard screenshot"

infrastructure:
  scorebot: "custom"
  network: >
    Teams used VirtualBox VM as a router into the competition network.
    VMs were encrypted; key disclosed on competition morning.
    No direct inter-team attacking; exploits submitted to organizers who
    ran them on behalf of submitting teams.
  flag_format: "framework-based"
  docker:
    full_environment: false
    individual_challenges: false

resources:
  announcement: "ictf20145_announcement.txt"

notes: >
  The 2014-2015 iCTF (organized in 2014 but run in April 2015) was themed
  "Large-scale Hacking." The competition used a novel infrastructure: teams
  received an encrypted VirtualBox VM as their router, with the decryption key
  disclosed on competition morning. No direct inter-team attacking was allowed;
  instead teams submitted exploits to the organizers, who ran them on behalf
  of the submitting team against target teams. Scoring used four components:
  SLA (service availability), Timeliness (bonus for early exploits),
  Diversity (bonus for exploiting more services), and Leetness (bonus based on
  how many teams had also exploited a service — rarer exploits worth more).
  The local archive is minimal (~888 KB): a MySQL dump, announcement, and
  scoreboard screenshots.
