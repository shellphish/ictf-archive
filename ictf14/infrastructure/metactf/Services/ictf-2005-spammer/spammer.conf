Listen 8123
<VirtualHost *:8123>
    DocumentRoot /usr/ctf/spammer/html
    AssignUserID spammer spammer
    Alias /spammer/ /usr/ctf/spammer/html/
    <Directory /usr/ctf/spammer/html>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog /var/ctf/spammer/error.log
    CustomLog /var/ctf/spammer/access.log combined
</VirtualHost>

