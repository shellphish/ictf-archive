Listen 8011
<VirtualHost *:8011>

    DocumentRoot /usr/ctf/estore/html
    AssignUserID estore estore
    ScriptAlias /cgi-bin/ /usr/ctf/estore/html/cgi-bin/
    Alias /estore/ /usr/ctf/estore/html/
    AddHandler cgi-script .php
    <Directory /usr/ctf/estore/html>
        Options +ExecCGI +FollowSymlinks
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog /var/ctf/estore/error.log
    CustomLog /var/ctf/estore/access.log combined
</VirtualHost>

