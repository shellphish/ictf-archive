Listen 8021
<VirtualHost *:8021>
    DocumentRoot /usr/ctf/contact/html
    AddHandler cgi-script .pl
    AssignUserID contact contact
    ScriptAlias /cgi-bin/ /usr/ctf/contact/html/cgi-bin/
    Alias /contact/ /usr/ctf/contact/html/
    <Directory /usr/ctf/contact/html>
        Options +ExecCGI +FollowSymlinks
        AllowOverride None
        Require all granted
    </Directory>
    DirectoryIndex contact.html
    ErrorLog /var/ctf/contact/error.log
    CustomLog /var/ctf/contact/access.log combined
</VirtualHost>