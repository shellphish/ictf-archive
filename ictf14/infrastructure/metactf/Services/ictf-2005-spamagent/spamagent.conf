Listen 8185
<VirtualHost *:8185>
    DocumentRoot /var/ctf/spamagent/html
    AddHandler cgi-script .pl
    AssignUserID spamagent spamagent
    ScriptAlias /cgi-bin/ /var/ctf/spamagent/html/cgi-bin/
    Alias /spamagent /var/ctf/spamagent/html
    <Directory /var/ctf/spamagent/html>
        Options +ExecCGI +FollowSymlinks
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog /var/ctf/spamagent/error.log
    CustomLog /var/ctf/spamagent/access.log combined
</VirtualHost>