Listen 8001
<VirtualHost *:8001>

    DocumentRoot /usr/ctf/museum/html
    AddHandler cgi-script .pl
    AssignUserID museum museum
    ScriptAlias /cgi-bin/ /usr/ctf/museum/html/cgi-bin/
    <Directory /usr/ctf/museum/html>
        Options +ExecCGI +FollowSymlinks
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog /var/ctf/museum/error.log
    CustomLog /var/ctf/museum/access.log combined
</VirtualHost>

