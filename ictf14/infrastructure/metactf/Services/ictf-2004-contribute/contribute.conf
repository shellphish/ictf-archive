Listen 8112
<VirtualHost *:8112>

    DocumentRoot /usr/ctf/contribute/public_html
    AddHandler cgi-script .py .php
    AssignUserID contribute contribute
    ScriptAlias /cgi-bin/ /usr/ctf/contribute/public_html/cgi-bin/
    <Directory /usr/ctf/contribute/public_html>
        Options +ExecCGI +FollowSymlinks
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog  /var/ctf/contribute/error.log
    CustomLog /var/ctf/contribute/access.log combined
</VirtualHost>
