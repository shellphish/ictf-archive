Alias /discussit/ /usr/ctf/discussit/html/
Listen 8020
<VirtualHost *:8020>

    DocumentRoot /usr/ctf/discussit/html
    AssignUserID discussit discussit
    ScriptAlias /cgi-bin/ /usr/ctf/discussit/html/cgi-bin/
    <Directory /usr/ctf/discussit/html>
        Options +ExecCGI +FollowSymlinks
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog /var/ctf/discussit/error.log
    CustomLog /var/ctf/discussit/access.log combined
</VirtualHost>

