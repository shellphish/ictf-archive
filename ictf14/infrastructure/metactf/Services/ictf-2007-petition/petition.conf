Listen 8017
<VirtualHost *:8017>

    DocumentRoot /var/ctf/petition/html
    AddHandler cgi-script .pl
    Alias /petition/ /var/ctf/petition/html/
    AddHandler cgi-script .py

    AssignUserID petition petition
    ScriptAlias /cgi-bin/ /var/ctf/petition/html/cgi-bin/
    <Files */cgi-bin/signers.txt>
         Deny from all
    </Files>
    <Directory /var/ctf/petition/html>
        Options +ExecCGI +FollowSymlinks
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog /var/ctf/petition/error.log
    CustomLog /var/ctf/petition/access.log combined
</VirtualHost>

