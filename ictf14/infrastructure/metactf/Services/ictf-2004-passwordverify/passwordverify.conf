Listen 8183
<VirtualHost *:8183>
    DocumentRoot /usr/ctf/passwordverify/html
    AddHandler cgi-script .pl
    AssignUserID passwordverify passwordverify
    ScriptAlias /cgi-bin/ /usr/ctf/passwordverify/html/cgi-bin/
    Alias /passwordverify /usr/ctf/passwordverify/html
    <Directory /usr/ctf/passwordverify/html>
        Options +ExecCGI +FollowSymlinks
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog /var/ctf/passwordverify/error.log
    CustomLog /var/ctf/passwordverify/access.log combined
</VirtualHost>

