Listen 8184
<VirtualHost *:8184>
    DocumentRoot /usr/ctf/acquire/html/cgi-bin
    AddHandler cgi-script .php
    AssignUserID acquire acquire
    ScriptAlias /cgi-bin/ /usr/ctf/acquire/html/cgi-bin/
    Alias /acquire /usr/ctf/acquire/html/
    <Directory /usr/ctf/acquire/html>
        Options +ExecCGI +FollowSymlinks
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog /var/ctf/acquire/error.log
    CustomLog /var/ctf/acquire/access.log combined
</VirtualHost>
