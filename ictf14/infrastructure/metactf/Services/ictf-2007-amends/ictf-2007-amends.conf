Listen 8016
<VirtualHost *:8016>

    DocumentRoot /usr/ctf/ictf-2007-amends/html
    AddHandler cgi-script .pl
    AssignUserID ictf-2007-amends ictf-2007-amends
    ScriptAlias /cgi-bin/ /usr/ctf/ictf-2007-amends/html/cgi-bin/
    Alias /ictf-2007-amends/ /usr/ctf/ictf-2007-amends/html/
    AddHandler cgi-script .php
    <Directory /usr/ctf/ictf-2007-amends/html>
        Options +ExecCGI +FollowSymlinks
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog /var/ctf/ictf-2007-amends/error.log
    CustomLog /var/ctf/ictf-2007-amends/access.log combined
</VirtualHost>

