Listen 8018
<VirtualHost *:8018>

    DocumentRoot /usr/ctf/contributions/html
    Alias /contributions/ /usr/ctf/contributions/html/
    AddHandler cgi-script .py

    AssignUserID contributions contributions
    ScriptAlias /cgi-bin/ /usr/ctf/contributions/html/cgi-bin/
    <Directory /usr/ctf/contributions/html>
        Options +ExecCGI +FollowSymlinks
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog /var/ctf/contributions/error.log
    CustomLog /var/ctf/contributions/access.log combined
</VirtualHost>

