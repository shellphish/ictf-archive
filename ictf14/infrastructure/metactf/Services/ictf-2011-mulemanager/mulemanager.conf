Listen 7899
<VirtualHost *:7899>
        DocumentRoot /usr/ctf/mulemanager/html/
        AddHandler cgi-script .php
        AssignUserID mulemanager mulemanager

        <Directory /usr/ctf/mulemanager/html>
                Options +ExecCGI +FollowSymLinks
                AllowOverride None
                Require all granted
        </Directory>
</VirtualHost>

