Listen 8180
<VirtualHost *:8180>

    DocumentRoot /usr/ctf/ictf-2004-pollit/html
    AddHandler cgi-script .pl
    AssignUserID ictf-2004-pollit ictf-2004-pollit
    ScriptAlias /cgi-bin/ /usr/ctf/ictf-2004-pollit/html/cgi-bin/
    Alias /ictf-2004-pollit /usr/ctf/ictf-2004-pollit/html
    <Directory /usr/ctf/ictf-2004-pollit/html>
        Options +ExecCGI +FollowSymlinks
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog /var/ctf/ictf-2004-pollit/error.log
    CustomLog /var/ctf/ictf-2004-pollit/access.log combined
</VirtualHost>
