Listen 8015
<VirtualHost *:8015>

    DocumentRoot /var/ctf/music-copyright/html
    AddHandler cgi-script .pl
    AssignUserID music-copyright music-copyright
    Alias /music-copyright/ /var/ctf/music-copyright/html/
    ScriptAlias /cgi-bin/ /var/ctf/music-copyright/html/cgi-bin/
    AddHandler cgi-script .php

    <Directory /var/ctf/music-copyright/html>
        Options +ExecCGI +FollowSymlinks
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog /var/ctf/music-copyright/error.log
    CustomLog /var/ctf/music-copyright/access.log combined
</VirtualHost>

