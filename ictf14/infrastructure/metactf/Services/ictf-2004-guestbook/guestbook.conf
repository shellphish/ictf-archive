Listen 8182
<VirtualHost *:8182>
    DocumentRoot /usr/ctf/guestbook/html
    AddHandler cgi-script .pl 
    AssignUserID guestbook guestbook
    ScriptAlias /cgi-bin/ /usr/ctf/guestbook/html/cgi-bin/
    Alias /guestbook /usr/ctf/guestbook/html
    <Directory /usr/ctf/guestbook/html>
        Options +ExecCGI +FollowSymlinks
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog /var/ctf/guestbook/error.log
    CustomLog /var/ctf/guestbook/access.log combined
</VirtualHost>