Listen 6789
<VirtualHost *:6789>

    DocumentRoot /usr/ctf/register/html
    AddHandler cgi-script .pl
    AssignUserID register register
    ScriptAlias /cgi-bin/ /usr/ctf/register/html/cgi-bin/
    <Directory /usr/ctf/register/html>
        Options +ExecCGI +FollowSymlinks
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog /var/ctf/register/error.log
    CustomLog /var/ctf/register/access.log combined
</VirtualHost>
