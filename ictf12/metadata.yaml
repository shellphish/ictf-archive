edition: ictf12
year: 2013
title: "SCADA Breakdown"

format: attack-defense
# Note: This edition ran in March 2013 (delayed from 2012 school year).
# The directory is named ictf12 but the competition is ictf 2012-2013.

dates:
  start: "2013-03-22"
  end: "2013-03-22"
  # From description3.txt: "March 22nd, 2013 from 8am PDT to 5pm PDT"

participation:
  num_teams: null
  notes: >
    International university teams. Registration via http://www.ictf2013.info.
    Known participating teams include PPP (CMU), c00kies@venice (Venice), and others.

results:
  winner: "PPP (Carnegie Mellon University)"
  notes: >
    PPP victory confirmed by c00kies@venice (Riccardo Focardi) in post-competition
    mailing list email: "congrats to PPP!" (March 26, 2013).

challenges:
  # Service names confirmed from ctf-admin mailing list emails (March 2013 and October 2013).
  # Email: "old iCTF's services for the cyber-something-something project" (Yanick Fratantonio,
  # Oct 16 2013) listed remaining ictf12 services. Note: "irs" was dropped the night before
  # the competition (Gianluca Stringhini email, Oct 19 2013); all others ran.

  - name: powerplan
    title: "Power Plan"
    category: binary
    description: >
      Operation Power Plan — Sabotaging the enemy's power grid. Player's agent
      infiltrates enemy power plants and shuts them down without being discovered.
      Agent is discovered if it revisits a previously-shut-down plant or goes off-grid.
      Movements controlled via this interface "innocently disguised as a game."
      (Authored by Kyle MacNamara; description from his email March 22, 2013.)

  - name: water
    title: "Water"
    category: binary
    description: >
      Water treatment SCADA service. Had some getflag script reliability issues
      during competition; scoring system had complaints on IRC.
      (Authored by Gianluca Stringhini; confirmed from post-competition emails.)

  - name: airplane
    title: "Airplane"
    category: binary
    description: "SCADA/critical infrastructure service (airplane systems). Exact mechanics not preserved."

  - name: curiosityblogging
    title: "Curiosity Blogging"
    category: web
    description: "Critical infrastructure service with a blogging/web theme. Exact mechanics not preserved."

  - name: pesticides
    title: "Pesticides"
    category: binary
    description: "SCADA/agricultural infrastructure service. Exact mechanics not preserved."

  - name: pewpew_smartgrid
    title: "PewPew Smart Grid"
    category: binary
    description: >
      Smart grid SCADA service. Name evokes the visual 'pew pew' of power
      grid attack visualizations. Exact mechanics not preserved.

  - name: stockjobber
    title: "Stock Jobber"
    category: web
    description: "Financial/stock market service. Exact mechanics not preserved."

  - name: nuclearboom
    title: "Nuclear Boom"
    category: binary
    description: >
      Nuclear power plant SCADA service. Confirmed by post-competition writeup
      (codezen.fr, March 24, 2013) and reference in ictf13 planning emails
      ("Take my old service 'nuclearboom' as reference"). Fits SCADA theme
      — nuclear plants are critical infrastructure.

data:
  - type: media
    path: "pictures/"
    description: "Event photographs"

  - type: other
    path: "description3.txt"
    description: "Full competition theme description and rules"

infrastructure:
  scorebot: "ctf-scorebot5"
  network: >
    Each team was given a server running critical infrastructure services.
    ZDI (Zebra Dwarf Institution) framework for exploit submission.
    Flow-based attack detection scoring.
  docker:
    full_environment: false
    individual_challenges: false

resources:
  ctftime: "https://ctftime.org/event/96"
  website: "http://www.ictf2013.info"

notes: >
  The 2012-2013 iCTF (directory ictf12) ran on March 22, 2013 from 8am to 5pm
  PDT. The theme was "SCADA Breakdown" — teams attacked critical infrastructure
  SCADA components. 8+ confirmed services from ctf-admin mailing list emails:
  powerplan (Kyle MacNamara), water (Gianluca Stringhini), airplane,
  curiosityblogging, pesticides, pewpew_smartgrid, stockjobber, nuclearboom.
  Note: "irs" was drafted but dropped the night before the competition.
  The competition used the "National Cyberdefense Corps" narrative: teams were
  hired to secure their country's infrastructure against Sicilian hackers.
  Scoring used the ZDI (Zebra Dwarf Institution) framework. The local archive
  is minimal (7.6 MB) with only pictures and description3.txt preserved.
