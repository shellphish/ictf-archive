description: |
  **iCTF 2012-2013 — SCADA Breakdown**

  airplane was a SCADA/critical infrastructure service in the iCTF 2012-2013
  competition (March 22, 2013). The theme was "National Cyberdefense Corps":
  teams attacked infrastructure run by hostile actors, defending their own.

  Air traffic control SCADA service. The vulnerability involved forging airplane position updates: the system used CRC32 as a weak 'HMAC' (not cryptographic), allowing teams to craft signed position updates. Also had RC4 key reuse for request/response encryption. By Benjamin Caillat. Security advisory: SEC-03-22-2013-DLF-17500.

  Source not available in archive.
