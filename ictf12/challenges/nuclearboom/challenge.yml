  **iCTF 2012-2013 — SCADA Breakdown**

  nuclearboom was a SCADA/critical infrastructure service in the iCTF 2012-2013
  competition (March 22, 2013). The theme was "National Cyberdefense Corps":
  teams attacked infrastructure run by hostile actors, defending their own.

  Nuclear power plant SCADA service. Confirmed from post-competition writeup (codezen.fr, March 24 2013). Reused in iCTF 2015 as nuclearboom2 on port 4444.

  Binary only; no source code in archive.
