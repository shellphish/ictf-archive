{% extends "base.html" %}
{% block title %}Sign up — Nexus{% endblock %}
{% block body %}
<div class="form-wrap">
  <div class="form-box">
    <h2>// Create account</h2>
    {% if error %}<div class="msg-error">{{ error }}</div>{% endif %}
    <form method="POST">
      <div class="form-field">
        <label>Username</label>
        <input name="username" autocomplete="username"
               pattern="[a-zA-Z0-9_]{3,20}" required>
        <div class="form-hint">3–20 chars, alphanumeric + underscore</div>
      </div>
      <div class="form-field">
        <label>Password</label>
        <input name="password" type="password" minlength="6"
               autocomplete="new-password" required>
        <div class="form-hint">Minimum 6 characters</div>
      </div>
      <div class="form-footer">
        <button type="submit" class="btn" style="width:100%;">Create account</button>
      </div>
    </form>
    <p class="form-link">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
