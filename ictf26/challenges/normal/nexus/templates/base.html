<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Nexus{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!--
    Content-Security-Policy: default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com
    X-Content-Type-Options: nosniff
    X-Frame-Options: DENY
    Referrer-Policy: same-origin

    Note: CSP blocks inline scripts and external script sources.
    Stored XSS via the website or bio fields would be neutralised by the CSP
    even if Jinja2 autoescaping were somehow bypassed.
    Admin session cookie: HttpOnly=True, SameSite=Lax.
  -->
  <style>
    :root {
      --bg:        #0a0b0f;
      --surface:   #0f1018;
      --card:      #13141d;
      --border:    #1c1e2b;
      --border-hi: #2a2d42;
      --accent:    #4f8ef7;
      --accent-d:  #3a6fd4;
      --text:      #d8dae8;
      --text-soft: #8b8fa8;
      --text-dim:  #4a4e68;
      --green:     #3dd68c;
      --red:       #f25c5c;
      --mono:      'IBM Plex Mono', monospace;
      --sans:      'IBM Plex Sans', sans-serif;
      --r:         6px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    .topbar {
      position: sticky; top: 0; z-index: 200;
      background: rgba(10,11,15,.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 2rem; height: 52px;
      gap: 2rem;
    }
    .topbar-logo {
      font-family: var(--mono);
      font-weight: 500; font-size: .85rem;
      color: var(--accent);
      letter-spacing: .12em; text-transform: uppercase;
    }
    .topbar-nav {
      display: flex; align-items: center; gap: .25rem;
      flex: 1;
    }
    .topbar-nav a {
      color: var(--text-soft); font-size: .82rem;
      padding: .35rem .75rem; border-radius: var(--r);
      transition: background .12s, color .12s;
      letter-spacing: .01em;
    }
    .topbar-nav a:hover  { background: var(--border); color: var(--text); }
    .topbar-nav a.active { color: var(--accent); }
    .topbar-right { margin-left: auto; display: flex; gap: .5rem; align-items: center; }
    .layout {
      max-width: 1060px; margin: 0 auto;
      padding: 2rem 1.5rem;
      display: grid;
      gap: 1.5rem;
    }
    .layout-3 { grid-template-columns: 200px 1fr 240px; }
    .layout-2 { grid-template-columns: 1fr 260px; }
    .layout-1 { grid-template-columns: 1fr; max-width: 520px; }
    @media (max-width: 860px) {
      .layout-3 { grid-template-columns: 1fr; }
      .layout-2 { grid-template-columns: 1fr; }
      .aside-l, .aside-r { display: none; }
    }
    .sidebar { display: flex; flex-direction: column; gap: 1px; }
    .sidebar-section {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 1rem; margin-bottom: .75rem;
    }
    .sidebar-section-title {
      font-family: var(--mono); font-size: .7rem; font-weight: 500;
      color: var(--text-dim); text-transform: uppercase;
      letter-spacing: .1em; margin-bottom: .75rem;
    }
    .sidebar a {
      display: block; padding: .45rem .6rem;
      border-radius: var(--r); color: var(--text-soft);
      font-size: .82rem; transition: all .1s;
    }
    .sidebar a:hover, .sidebar a.active {
      background: var(--border); color: var(--text);
    }
    .sidebar a.active { color: var(--accent); }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 1.25rem;
    }
    .card-title {
      font-family: var(--mono); font-size: .7rem; font-weight: 500;
      color: var(--text-dim); text-transform: uppercase;
      letter-spacing: .1em; margin-bottom: 1rem;
    }
    .post {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 1rem 1.25rem;
      margin-bottom: .5rem; transition: border-color .1s;
    }
    .post:hover { border-color: var(--border-hi); }
    .post-header {
      display: flex; align-items: center; gap: .6rem;
      margin-bottom: .5rem;
    }
    .post-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--border-hi);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-size: .7rem; font-weight: 500;
      color: var(--text-soft); flex-shrink: 0;
    }
    .post-author { font-weight: 600; font-size: .85rem; color: var(--text); }
    .post-author:hover { color: var(--accent); }
    .post-ts { margin-left: auto; font-size: .72rem; color: var(--text-dim); font-family: var(--mono); }
    .post-body { font-size: .9rem; line-height: 1.65; color: var(--text); margin-bottom: .75rem; }
    .post-actions { display: flex; gap: .4rem; }
    .post-actions form { display: inline; }
    .btn-ghost {
      background: none; border: 1px solid var(--border);
      color: var(--text-soft); padding: .25rem .7rem;
      border-radius: 99px; font-size: .75rem; cursor: pointer;
      transition: all .1s; font-family: var(--sans);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .compose {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 1rem 1.25rem; margin-bottom: .75rem;
    }
    .compose textarea {
      width: 100%; background: none; border: none; outline: none;
      color: var(--text); font-family: var(--sans); font-size: .9rem;
      resize: none; min-height: 64px; line-height: 1.6;
    }
    .compose textarea::placeholder { color: var(--text-dim); }
    .compose-footer {
      display: flex; justify-content: flex-end; align-items: center;
      gap: .75rem; margin-top: .5rem;
      padding-top: .75rem; border-top: 1px solid var(--border);
    }
    .char-count { font-family: var(--mono); font-size: .72rem; color: var(--text-dim); }
    .btn {
      display: inline-block; padding: .45rem 1.1rem;
      background: var(--accent); color: #fff;
      border: none; border-radius: var(--r);
      font-family: var(--sans); font-weight: 600;
      font-size: .82rem; cursor: pointer; text-decoration: none;
      transition: background .1s, opacity .1s;
      letter-spacing: .01em;
    }
    .btn:hover { background: var(--accent-d); }
    .btn-outline {
      background: transparent; color: var(--accent);
      border: 1px solid var(--accent);
    }
    .btn-outline:hover { background: rgba(79,142,247,.08); }
    .btn-sm { padding: .3rem .75rem; font-size: .78rem; }
    .btn-ghost-nav {
      background: none; border: 1px solid var(--border);
      color: var(--text-soft); padding: .3rem .75rem;
      border-radius: var(--r); font-size: .78rem;
      font-family: var(--sans); cursor: pointer; transition: all .1s;
    }
    .btn-ghost-nav:hover { border-color: var(--border-hi); color: var(--text); }
    .form-wrap {
      display: flex; align-items: center; justify-content: center;
      min-height: 82vh; padding: 2rem 1rem;
    }
    .form-box {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 2rem;
      width: 100%; max-width: 400px;
    }
    .form-box h2 {
      font-family: var(--mono); font-size: 1rem; font-weight: 500;
      margin-bottom: 1.5rem; color: var(--text);
      letter-spacing: .04em;
    }
    .form-field { margin-bottom: .9rem; }
    .form-field label {
      display: block; font-size: .72rem; font-weight: 500;
      color: var(--text-soft); margin-bottom: .35rem;
      text-transform: uppercase; letter-spacing: .06em; font-family: var(--mono);
    }
    .form-field input,
    .form-field textarea,
    .form-field select {
      width: 100%; padding: .6rem .8rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); color: var(--text);
      font-family: var(--sans); font-size: .88rem; outline: none;
      transition: border-color .12s;
    }
    .form-field input:focus,
    .form-field textarea:focus { border-color: var(--accent); }
    .form-field textarea { resize: vertical; min-height: 80px; }
    .form-hint { font-size: .72rem; color: var(--text-dim); margin-top: .3rem; font-family: var(--mono); }
    .form-footer { margin-top: 1.25rem; }
    .form-link { font-size: .8rem; color: var(--text-soft); margin-top: .9rem; text-align: center; }
    .form-link a { color: var(--accent); }
    .msg-error   { color: var(--red);   font-size: .82rem; margin-bottom: .9rem; padding: .5rem .75rem; background: rgba(242,92,92,.08); border-radius: var(--r); border: 1px solid rgba(242,92,92,.2); }
    .msg-success { color: var(--green); font-size: .82rem; margin-bottom: .9rem; padding: .5rem .75rem; background: rgba(61,214,140,.08); border-radius: var(--r); border: 1px solid rgba(61,214,140,.2); }
    .profile-header {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 1.75rem;
      display: flex; gap: 1.5rem; align-items: flex-start;
      margin-bottom: .75rem;
    }
    .profile-avatar {
      width: 64px; height: 64px; border-radius: 50%;
      background: var(--border-hi); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-size: 1.2rem; font-weight: 500;
      color: var(--accent);
    }
    .profile-info h1 {
      font-family: var(--mono); font-size: 1.1rem; font-weight: 500;
      margin-bottom: .35rem; letter-spacing: .02em;
    }
    .profile-stats {
      display: flex; gap: 1.5rem; margin: .5rem 0;
      font-size: .8rem; color: var(--text-soft); font-family: var(--mono);
    }
    .profile-stats b { color: var(--text); }
    .bio-block { margin-top: .5rem; }
    .bio-text { font-size: .88rem; color: var(--text-soft); line-height: 1.7; }
    .profile-website { font-size: .78rem; color: var(--accent); font-family: var(--mono); margin-top: .35rem; }
    .dm-item { padding: .75rem 0; border-bottom: 1px solid var(--border); }
    .dm-item:last-child { border-bottom: none; }
    .dm-meta { font-size: .72rem; color: var(--text-dim); font-family: var(--mono); margin-bottom: .25rem; }
    .dm-body { font-size: .88rem; color: var(--text); }
    .sug { display: flex; align-items: center; gap: .75rem; padding: .5rem 0; }
    .sug + .sug { border-top: 1px solid var(--border); }
    .sug-av {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--border-hi);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-size: .7rem; color: var(--text-soft);
      flex-shrink: 0;
    }
    .sug-name { flex: 1; min-width: 0; }
    .sug-name a { font-weight: 600; font-size: .82rem; color: var(--text); }
    .sug-name a:hover { color: var(--accent); }
    .sug-bio { font-size: .72rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mono { font-family: var(--mono); }
    .muted { color: var(--text-soft); }
    .dimmed { color: var(--text-dim); }
    .center { text-align: center; }
    hr.divider { border: none; border-top: 1px solid var(--border); margin: 1rem 0; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

{% if session.user %}
<nav class="topbar">
  <span class="topbar-logo">NX / Nexus</span>
  <div class="topbar-nav">
    <a href="{{ url_for('feed') }}"    {% if request.endpoint == 'feed'    %}class="active"{% endif %}>Feed</a>
    <a href="{{ url_for('explore') }}" {% if request.endpoint == 'explore' %}class="active"{% endif %}>Explore</a>
    <a href="{{ url_for('search') }}"  {% if request.endpoint == 'search'  %}class="active"{% endif %}>Search</a>
    <a href="{{ url_for('dm') }}"      {% if request.endpoint == 'dm'      %}class="active"{% endif %}>Messages</a>
    <a href="{{ url_for('profile', username=session.user) }}" {% if request.endpoint == 'profile' %}class="active"{% endif %}>Profile</a>
    <a href="{{ url_for('settings') }}" {% if request.endpoint == 'settings' %}class="active"{% endif %}>Settings</a>
  </div>
  <div class="topbar-right">
    <span class="mono dimmed" style="font-size:.72rem;">{{ session.user }}</span>
    <a href="{{ url_for('logout') }}" class="btn-ghost-nav">Log out</a>
  </div>
</nav>
{% else %}
<nav class="topbar">
  <span class="topbar-logo">NX / Nexus</span>
  <div class="topbar-right" style="margin-left:auto;">
    <a href="{{ url_for('login') }}" class="btn-ghost-nav">Log in</a>
    <a href="{{ url_for('register') }}" class="btn btn-sm">Sign up</a>
  </div>
</nav>
{% endif %}

{% block body %}{% endblock %}

</body>
</html>
