name: "Waldo’s State (Reference)"
category: "agentic"
description: |
  Waldo is hiding in a famous city in the United States.

  This is an **agentic challenge**: an agent (running in the sandbox container)
  can query two MCP servers:

  - `waldo_landmarks`: returns three landmarks near Waldo’s location
  - `guess_state`: returns the flag if the agent guesses the correct US state

value: 100
type: standard

flags:
  - flag: "ictf{waldo_lives_in_the_right_state}"
    type: PLAINTEXT

tags:
  - agent
  - mcp
  - reference
  - geography

hints:
  - hint: "Use the landmarks to infer the city/state."
    cost: 0

files: []

hidden: false
max_attempts: 0

extra:
  docker_compose: "docker-compose.yml"
  challengish: "challengish.yml"
