services:
  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    profiles: [debug]
    environment:
      OPENAI_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-local-admin-key}
    volumes:
      - ../../stubs/litellm_stub/config.yaml:/app/config.yaml:ro
      - ../../stubs/litellm_stub/custom_auth.py:/app/custom_auth.py:ro
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    ports:
      - "4000:4000"

  langfuse:
    build:
      context: ../../stubs
      dockerfile: langfuse_stub/Dockerfile
    profiles: [debug]
    environment:
      PORT: "3000"
    ports:
      - "3000:3000"

  datastore:
    build:
      context: .
      dockerfile: services/datastore/Dockerfile
    environment:
      REDIS_URL: redis://127.0.0.1:6379/0
      FORCE_REGEN: ${FORCE_REGEN:-0}
    ports:
      - "6379:6379"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -p 6379 EXISTS monitor:config | grep -q '^1$$'"]
      interval: 5s
      timeout: 5s
      retries: 60

  target_app:
    build:
      context: .
      dockerfile: services/minio_target/Dockerfile
    environment:
      REDIS_HOST: datastore
      REDIS_PORT: "6379"
      GODEBUG: gctrace=1
    depends_on:
      datastore:
        condition: service_healthy
    ports:
      - "7001:7001"
    cpus: 2
    mem_limit: 4g
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7001/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60

  mcp_flag:
    build:
      context: .
      dockerfile: services/mcp_flag/Dockerfile
    environment:
      REDIS_URL: redis://datastore:6379/0
      PORT: "7002"
      FLAG_CHALLENGE: ${FLAG_CHALLENGE}
    depends_on:
      datastore:
        condition: service_healthy
    ports:
      - "7002:7002"
    restart: unless-stopped

  sandbox:
    profiles: [debug]
    build:
      context: ../../stubs
      dockerfile: sandbox_stub/Dockerfile
    environment:
      MCP_SHELL_URL: http://target_app:7001
      MCP_FLAG_URL: http://mcp_flag:7002
      AGENT_FILE: /workspace/solve.py
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      TEAM_LITELLM_API_KEY: ${TEAM_LITELLM_API_KEY:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      TEAM_LITELLM_MODEL: ${TEAM_LITELLM_MODEL:-gpt-4o-mini}
    volumes:
      - ./writeup:/workspace:ro
    depends_on:
      litellm:
        condition: service_started
      langfuse:
        condition: service_started
      datastore:
        condition: service_healthy
      target_app:
        condition: service_healthy
      mcp_flag:
        condition: service_started
    restart: "no"
