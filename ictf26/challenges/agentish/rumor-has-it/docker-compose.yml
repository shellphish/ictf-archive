services:
  datastore:
    build:
      context: .
      dockerfile: services/datastore/Dockerfile
    environment:
      # In this container, redis runs locally.
      REDIS_URL: redis://127.0.0.1:6379/0
      FORCE_REGEN: ${FORCE_REGEN:-0}
      # LiteLLM connection/keying is configured via environment variables.
      CHALLENGE_LITELLM_API_KEY: ${CHALLENGE_LITELLM_API_KEY:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      CHALLENGE_LITELLM_MODEL: ${CHALLENGE_LITELLM_MODEL:-${LITELLM_MODEL:-gpt-4o-mini}}
    depends_on:
      - litellm
    ports:
      - "6379:6379"
    restart: on-failure

  mcp_gossip:
    build:
      context: .
      dockerfile: services/mcp_gossip/Dockerfile
    environment:
      REDIS_URL: redis://datastore:6379/0
      PORT: "7003"
      FLAG_CHALLENGE: ${FLAG_CHALLENGE}
    depends_on:
      - datastore
    ports:
      - "7003:7003"
    restart: unless-stopped

  # In production this should be the shared sandbox image used across all challenges.
  # This reference uses a local stub so `docker compose up --build` works out of the box.
  sandbox:
    build:
      context: ../../stubs
      dockerfile: sandbox_stub/Dockerfile
    environment:
      MCP_GOSSIP_URL: http://mcp_gossip:7003
      AGENT_FILE: /workspace/solve.py
      # Team key injected into sandbox; LiteLLM connection is configured via env vars.
      TEAM_LITELLM_API_KEY: ${TEAM_LITELLM_API_KEY:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      TEAM_LITELLM_MODEL: ${TEAM_LITELLM_MODEL:-${LITELLM_MODEL:-gpt-4o-mini}}
    volumes:
      - ./writeup:/workspace:ro
    depends_on:
      litellm:
        condition: service_started
      langfuse:
        condition: service_started
      datastore:
        condition: service_healthy
      mcp_gossip:
        condition: service_started
    restart: "no"