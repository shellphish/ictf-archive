# =============================================================================
# docker-compose.yml — Roguelike Maze CTF Challenge
# =============================================================================
#
# Usage:
#   cd roguelike-maze/
#   docker compose up --build
#
# Services:
#   - agentish:  Visual workflow editor at http://localhost:8000
#   - mcp_maze:  MCP game server (internal, port 7001)
# =============================================================================

services:

  # ---------- Agentish UI ----------
  agentish:
    build:
      context: .
      dockerfile: Dockerfile.agentish
    environment:
      CHALLENGISH_CONFIG_PATH: /app/challengish.yml
    ports:
      - "8000:8000"
    depends_on:
      - mcp_maze

  # ---------- MCP Maze Game Server ----------
  mcp_maze:
    build:
      context: .
      dockerfile: Dockerfile.mcp_maze
    environment:
      FLAG_CHALLENGE: ${FLAG_CHALLENGE}
      # MAZE_SEED: "42"  # Uncomment for deterministic maze
    ports:
      - "7001:7001"