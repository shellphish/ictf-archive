server.document-root = "/home/vigna/Development/macos/src/banksite"

server.port = 3000

mimetype.assign = (
  ".html" => "text/html", 
  ".txt" => "text/plain",
  ".jpg" => "image/jpeg",
  ".png" => "image/png"
)

server.modules = ( 
	"mod_access",
	"mod_alias",
	"mod_accesslog",
	"mod_cgi",
	"mod_fastcgi",
)

fastcgi.server = ( ".php" => (( 
                     "bin-path" => "//php-cgi",
                     "socket" => "/tmp/php.socket",
                 )))

cgi.assign = (".php"  => "/usr/bin/php" )
cgi.fix_pathinfo = 1