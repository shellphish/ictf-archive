name: "iCTF 2006 — Hillbilly Bank: Insurance Service"
author: "Giovanni Vigna / UCSB Security Lab"
category: web
description: |
  **iCTF 2006 — The Hillbilly Bank**

  The Hillbilly Insurance service lets customers purchase car insurance by
  submitting an RSA-signed check and personal details. After purchase, customers
  can log in and file damage claims.

  The service is a PHP application served by lighttpd on port 1335. Key
  vulnerabilities:

  1. **SQL injection** in `claim.php`: the `$_POST["desc"]` (claim description)
     is inserted into SQL without sanitization.
  2. **Logic flaw** in `claim.php`: the `$value` variable controlling the
     insurance cap comes from the outer session scope but `$damage` comparison
     uses it before it is set if not in the right path.
  3. Credentials: MySQL `insurance` database, username `ins`, password `abracadabra`.

  *Source extracted from the CTF VM (Ubuntu, VMware VMDK) via qemu-img + debugfs.*
