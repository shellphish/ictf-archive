name: "iCTF 2011 — muleuser"
author: "Shellphish"
category: web
description: |
  **iCTF 2011 — Money Laundering**

  `muleuser` is the end-user portal for money mules — 2,953 flag captures.

  Port: **80** (HTTP, Apache 2.x UserDir + PHP-CGI)
  Path: `/~muleuser/cgi-bin/`

  ## Architecture

  PHP-CGI scripts served via Apache `mod_userdir`. All scripts share
  `/var/www/library.php` (same as `mulemanager` and `muleadmin`).

  Scripts:
  - `browsers/` — browser-detection PHP scripts (chrome, firefox, ie6/7/8,
    mozilla, opera, safari), each checks the User-Agent and customizes output
  - `sendmessage` — submit a message to another mule
  - `viewmessage` — read received messages (flag channel)

  Message files stored in `/home/muleuser/public_html/cgi-bin/messages/` as
  `message.<cookie>` files.

  ## Attack Surface

  The `data_chars` whitelist in `library.php` includes `'`. The browser
  User-Agent fingerprinting and message file naming may allow path traversal
  or injection in the message storage/retrieval path.
