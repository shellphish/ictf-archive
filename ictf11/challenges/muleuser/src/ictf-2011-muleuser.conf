Listen 8002
<VirtualHost *:8002>
    
    DocumentRoot /usr/ctf/ictf-2011-muleuser/html
    AssignUserID ictf-2011-muleuser ictf-2011-muleuser
    ScriptAlias /cgi-bin/ /usr/ctf/ictf-2011-muleuser/html/cgi-bin/
    <Directory /usr/ctf/ictf-2011-muleuser/html>
        Options +ExecCGI +FollowSymlinks
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog /var/ctf/ictf-2011-muleuser/error.log
    CustomLog /var/ctf/ictf-2011-muleuser/access.log combined
</VirtualHost>

