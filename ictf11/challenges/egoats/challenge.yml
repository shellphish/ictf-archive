name: "iCTF 2011 — egoats"
author: "Shellphish"
category: web
description: |
  **iCTF 2011 — Money Laundering**

  egoats is a Ruby on Rails web application used as a cover story for money
  laundering — a "legitimate" online goat-selling marketplace. Under the hood,
  it handles payments and remote fund transfers between teams.

  Port: **53550** (Rails production, REE 1.8.7)

  ## Architecture

  Rails 3.x with Devise authentication. Resources:
  - `users` — account management, `/users/me` (current user profile)
  - `payments` — create/show payments, poll remote payment status
  - `remote_payments` — cross-team fund transfers (update/show/edit)
  - `credit_cards` — stored card management

  The competition scenario: competitors steal egoats accounts from IRC channel
  `#egoats` and use payment APIs to drain funds across teams.

  ## Source

  Extracted from competition VM (Ubuntu 10.10 LVM, ext4). Full Rails app:
  - `src/app/controllers/` — PaymentsController, RemotePaymentsController,
    UsersController, CreditCardsController
  - `src/app/models/` — User, Payment, CreditCard, RemotePayment
  - `src/config/routes.rb` — route definitions
  - `src/db/schema.rb` — database schema
  - `src/Gemfile` — gem dependencies
  - `src/launch` — startup script (RVM + rake db:migrate + rails s -p 53550)
