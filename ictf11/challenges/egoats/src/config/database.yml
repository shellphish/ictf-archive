# SQLite version 3.x
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem 'sqlite3'
development:
  adapter: mysql2
  database: egoats_development
  username: egoats
  encoding: utf8
  host: localhost
  pool: 5
  timeout: 5000


test:
  adapter: mysql2
  database: egoats_test
  encoding: utf8
  host: localhost
  username: egoats
  pool: 5
  timeout: 5000

production:
  adapter: sqlite3
  database: db/production.sqlite3
  pool: 5
  timeout: 5000
