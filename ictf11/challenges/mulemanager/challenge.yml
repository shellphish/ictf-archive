name: "iCTF 2011 — mulemanager"
author: "Shellphish"
category: web
description: |
  **iCTF 2011 — Money Laundering**

  `mulemanager` is the central PHP web application for managing money mule
  operations. Served by Apache 2.x at the document root (`/var/www/`), it
  provides account registration, login, profile management, mission assignment,
  and money transfer functionality.

  Port: **80** (HTTP, Apache 2.x, PHP 5.x)

  ## Architecture

  PHP application with a shared `library.php` (21 KB, 600+ lines) containing
  database helpers, sanitization, session management, and HTML rendering.

  Pages:
  - `index.php` — landing page
  - `login.php` / `logout.php` — authentication
  - `register.php` — account creation
  - `profile.php` — view/edit profile
  - `update.php` — update account data
  - `mission.php` — view/accept laundering missions
  - `contact.php` — contact form
  - `main.php` — dashboard

  The `library.php` implements `sanitize_r_data()` for input filtering via a
  whitelist (`$data_chars`) that includes `'` — making its sanitization
  insufficient for SQL contexts.

  MySQL credentials: `mulemanager / grabthiswhileyoucan` (in library.php).

  ## Vulnerability

  `profile.php` (line 25) appends an unsanitized `$test_fail_condition` to a
  prepared-statement query string:
  ```php
  $st = mysqli_prepare($db, "SELECT ... FROM users WHERE username = ? $test_fail_condition");
  ```
  If the scorebot sets `$test_fail_condition`, extra SQL can be injected.

  Additionally, `profile.php` redirects to `update.php` with all user fields
  including the **stored password hash in the URL** as a GET parameter —
  exposing it in browser history and server access logs.

  ## Source

  Fully recovered from competition VM `/var/www/`:
  - `src/library.php` — shared library (DB connection, sanitize, auth)
  - `src/mission.php` — mule assignment logic (most complex, 8710 bytes)
  - `src/profile.php` — user profile view (contains SQL construction bug)
  - `src/update.php` — update form handler (password exposed in URL)
  - `src/register.php`, `src/login.php`, `src/logout.php`, `src/contact.php`
  - `src/main.php`, `src/index.php`, `src/send.php`
