description: |
  **iCTF 2011 — Money Laundering**

  Mule Manager was the management backend for the money mule operation.
  Second most-captured service with 34,559 flag steals.

  Competitors exploited vulnerabilities in the mule management interface to
  extract flags stored in the database.

  Source: encrypted VM archive `site/iC7F-l337-vu1n.7z` (AES-encrypted, password unknown).
