name: "iCTF 2011 — Mule Admin"
author: "Giovanni Vigna / UCSB Security Lab"
category: web
description: |
  **iCTF 2011 — Money Laundering**

  Mule Admin was the administrator portal for the money laundering mule operation.
  The most-captured service with 46,867 flag steals, making it the primary attack
  target of the competition.

  Competitors exploited web vulnerabilities to access the admin panel and steal
  flags representing dirty money waiting to be laundered.

  Source: encrypted VM archive `site/iC7F-l337-vu1n.7z` (AES-encrypted, password unknown).
