description: |
  **iCTF 2011 — Money Laundering**

  `muleadmin` is the administrator portal for the money mule operation —
  the most-captured service with **46,867** flag steals.

  Port: **80** (HTTP, Apache 2.x UserDir + PHP-CGI)
  Path: `/~muleadmin/cgi-bin/groups` and `/~muleadmin/cgi-bin/users`

  ## Architecture

  PHP-CGI scripts served via Apache's `mod_userdir` at `/~muleadmin/`.
  Both scripts share `/var/www/library.php` (same library as `mulemanager`).

  MySQL credentials: `mulemanager / grabthiswhileyoucan` (database: `mulemanager`)

  - `groups` (15 KB) — create/delete groups, add/remove users, list members
  - `users` (16 KB) — user management, registration, roles
  - Both use `ticket_log()` for flag-associated audit trail
  - `ticket` parameter passed as GET arg, logged to database on group operations

  The `tickets` directory at `/home/muleadmin/tickets/` stores flag-value
  tickets written by the scorebot.

  ## Attack Surface

  The `data_chars` whitelist in `library.php` includes `'` (single quote).
  Any SQL query built via string interpolation after `sanitize_r_data()` is
  vulnerable to SQL injection. The ticket log pattern is the flag channel.
