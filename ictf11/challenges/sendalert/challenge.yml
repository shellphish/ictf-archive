name: "iCTF 2011 — sendalert"
author: "Giovanni Vigna / UCSB Security Lab"
category: web
description: |
  **iCTF 2011 — Money Laundering**

  `sendalert` is a Python 2.6 HTTP server (ThreadingHTTPServer) that provides
  an alert/notification web interface for suspicious transactions. Mules use it
  to send batch alerts to other participants.

  Port: **11111** (HTTP)
  Connects to: `msgdispatcher` at port 31337

  ## Architecture

  Endpoints: `/login`, `/logout`, `/register`, `/status`, `/send`, `/batch`

  Session cookies use MD5 of `secret + username` where secret is hardcoded
  as `"milkthemule"` — trivially forgeable if the username is known.

  SQLite3 database stores user accounts and message queues.
  Config file (`sendalert.ini`) seeds initial users and alert data.

  ## Vulnerabilities

  1. **Forged session cookie**: Session cookie is `MD5(secret + username)` where
     `secret = "milkthemule"` (hardcoded in `sendalert.py`). Any attacker who
     knows a valid username can forge a valid session cookie.

  2. **SQL injection via forged session** (second-order): After forging a
     cookie, it's used in a non-parameterized query:
     ```python
     cur.execute("""select username, data from users where session='%s'""" % session)
     ```
     Since the attacker controls `session`, this is a direct SQL injection.

  ## Source

  Fully recovered from competition VM (`/usr/local/bin/`):
  - `src/sendalert.py` — complete Python HTTP server (25 KB, full source)
  - `src/sendalert_main` — startup wrapper shell script
  - `src/sendalert.ini` — initial user/data seeding config
  - `src/init_sendalert` — init.d script
