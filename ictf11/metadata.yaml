infrastructure:
  scorebot: "custom"
  network: "Multiple team networks"
  game_state: "JSON pushed to teams on port 55555 TCP each tick"
  docker:
    full_environment: false
    individual_challenges: false

resources:
  website: "https://ictf.cs.ucsb.edu/archive/2011/site"

notes: >
  The 2011 iCTF theme was money laundering. Teams defended 10 services and
  exploited rivals' copies. Captured flags were submitted to a "money launderer"
  (the scorekeeper) for points, but the conversion carried risk — the feds could
  detect the laundering operation and penalize teams. Game state was pushed to
  teams via a JSON stream on port 55555 TCP each scoring tick. Services included
  mule management, convict records, email/SMS gateways, and message dispatchers.
  The service VM is in site/iC7F-l337-vu1n.7z (AES-encrypted 7z, 772MB containing
  iCTF 2011 Server.ova). Network infrastructure is in site/iC7F11-n37.ova (334MB).
  Total archive: ~1.6 GB (minimal — traffic dumps not preserved).
