edition: ictf11
year: 2011
title: "Do You Feel Lucky?"
subtitle: "Money Laundering"

format: attack-defense
# Operational theme: teams laundered "dirty" points through service exploitation.
# Services all themed around money mule management.

dates:
  start: "2011-12-02"
  end: "2011-12-02"
  # Friday, December 2, 2011, 8am–5pm PST (from iCTF_2011_Description.txt)

participation:
  num_teams: 85
  notes: >
    International university teams. 85 teams competed; sponsored by Adobe
    (1st: $2,000, 2nd: $1,000, 3rd: $500). 52 standalone challenges available
    (45 of 52 were solved). First challenge solved at 8:03am (3 min in);
    last at 4:50pm. Average money-to-points conversion: 2%.

