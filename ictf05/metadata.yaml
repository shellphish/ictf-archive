edition: ictf05
year: 2005
title: "The Spam Museum"

format: attack-defense

dates:
  start: "2005-12-09"
  end: "2005-12-09"
  # From 20051209_iCTF directory name

participation:
  num_teams: null
  notes: "Team count not documented. Competition included international teams."

results:
  winner: "0ld Eur0pe — 13,191,520 pts"
  final_scoreboard:
    - {rank: 1, team: "0ld Eur0pe",           score: 13191520, offensive: 5196930, defensive: 3498532}
    - {rank: 2, team: "We_0wn_Y0u",           score: 11282123, offensive: 2787410, defensive: 1387203}
    - {rank: 3, team: "Wizards of DoS",       score: 10636913, offensive: 1277587, defensive: 930490}
    - {rank: 4, team: "SIGMIL",               score:  9233317, offensive: 1991962, defensive: 933024}
    - {rank: 5, team: "The Tower of Hanoi",   score:  8956774, offensive: 4668217, defensive: 213508}
  notes: >
    From site/final_score.html (dated December 9, 2005). Full scoreboard preserved
    in that file (~20 teams). 0ld Eur0pe won with highest combined offensive+defensive score.

challenges:
  - name: spamagent
    title: "Spam Agent"
    category: web
    description: "HTTP XML+Tcl agent executor at /~spamagent/spamagent.html; flag via store command."

  - name: spaminout
    title: "Spam In/Out Gateway"
    category: binary
    description: "Dual-port TCP gateway (8008 in, 8009 out); SPAM-IN-SPAM-OUT header protocol."

  - name: ftp
    title: "FTP Service"
    category: binary
    description: "Anonymous FTP server; flags stored as files in /home/ftp/incoming/."

  - name: acquire
    title: "Acquire Relay Tracker"
    category: web
    description: "PHP CGI spam relay tracker; flag stored as 'de' field for random IPv6 address."

  - name: museum
    title: "Spam Museum"
    category: web
    description: "Perl CGI idea collector at /~museum/; flag stored as idea field."

  - name: spammer
    title: "Spammer Daemon"
    category: binary
    description: "TCP daemon on port 4570 with SMTP-like protocol; flag stored as message body."

  - name: syscalld
    title: "Syscall Daemon"
    category: binary
    description: "TCP service on port 31337; XOR-obfuscated binary protocol; flag in memory dump."

  - name: aqs
    title: "AQS Guestbook"
    category: web
    description: "Python CGI guestbook at /~aqs/; flag stored as private comment."

  - name: contribute
    title: "Contribute"
    category: web
    description: "Web contribution form at /~contribute/; flag stored as address field."

  - name: spamgen
    title: "Spamgen"
    category: web
    description: "Spam generator with HTTP form and UDP query interface; flag as uploaded text."

  - name: spamdb
    title: "SpamDB"
    category: web
    description: "PHP XML-RPC spam database at /~spamdb/cgi-bin/server.php."

data:
  - type: other
    path: "site/"
    description: "Original competition website"

  - type: pcap
    path: "dumps/"
    description: "Network traffic captures"

  - type: vm_image
    path: "CTF2005_spam_with_netdumps/"
    description: "VM and network dump archives for spam services"

  - type: media
    path: "pictures/"
    description: "Event photographs"

  - type: other
    path: "CTF_setup/"
    description: >
      Network setup documentation: mainbox, teambox, imagebox configs,
      VMware Blender tool, network topology (Network.fig)

infrastructure:
  scorebot: "custom"
  network: >
    VMware-based multi-team setup with mainbox, teambox, and imagebox.
    Network architecture documented in CTF_setup/README.
  docker:
    full_environment: false
    individual_challenges: false

resources:
  website: "https://ictf.cs.ucsb.edu/archive/2005/site"

notes: >
  The theme of the 2005 iCTF was the SPAM Museum, inspired by the actual
  SPAM (the food) Museum in Austin, Minnesota. The competition centered on
  spam-related services: teams attacked and defended systems involved in spam
  sending, filtering, and measurement. The archive contains CTF_setup/
  documentation showing the VMware-based network architecture, and spam2005Scripts/
  with the scoring and spam generation infrastructure. An encrypted version
  of the full VM images exists (ctf05-final.tar.gz.gpg — key unknown).
