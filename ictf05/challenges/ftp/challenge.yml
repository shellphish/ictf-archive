name: "iCTF 2005 — Spam World: FTP Service"
author: "Shellphish"
category: binary
description: |
  **iCTF 2005 — The Spam Museum: FTP Service**

  A custom C FTP server (anonymous login). The scorebot stores the flag as a
  randomly-named file in `/home/ftp/incoming/` via `STOR`, and retrieves it
  via `RETR`. Any connected user can `LIST` the `incoming/` directory and
  `RETR` all files — all flags are publicly accessible without authentication.
  Source code available: look for buffer overflows and path traversal in the
  custom C implementation.
