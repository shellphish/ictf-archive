name: "iCTF 2005 — Spam World: Syscall Daemon"
author: "Giovanni Vigna / UCSB Security Lab"
category: binary
description: |
  **iCTF 2005 — The Spam World**

  A TCP service on port 31337 that exposes a custom binary protocol. The service
  version string contains a seed value; all instructions are XOR-obfuscated with
  that seed. The flag is stored as a "memory dump" in little-endian 32-bit words.
  Reverse engineer the protocol to extract the flag.
