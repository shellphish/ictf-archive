name: "iCTF 2005 — Spam World: Contribute"
author: "Giovanni Vigna / UCSB Security Lab"
category: web
description: |
  **iCTF 2005 — The Spam Museum: Contribute**

  A Python CGI accepting financial contributions to the Spam Museum (name,
  amount, address, credit card number). Flags are stored as contribution records
  in a MySQL database. SQL injection: the INSERT query is built with Python
  string formatting — no escaping, no parameterization:
  `VALUES (%s, "%s", %s, "%s", "%s")` — all string fields are injectable.
  Hardcoded dev password `ctftest` visible in source.
