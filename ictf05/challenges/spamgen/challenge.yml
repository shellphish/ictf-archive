description: |
  **iCTF 2005 — The Spam World**

  A spam generation service with both HTTP and UDP interfaces. Users authenticate
  and upload spam text (the flag) via a web form at `/~spamgen/cgi-bin/spamgen.py`.
  A UDP listener on port 2345 serves file listings; HTTPS on port 4443 serves files.
