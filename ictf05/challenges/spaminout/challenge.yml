name: "iCTF 2005 — Spam World: Spam In/Out Gateway"
author: "Giovanni Vigna / UCSB Security Lab"
category: binary
description: |
  **iCTF 2005 — The Spam World**

  A dual-port TCP spam gateway. Port 8008 (spam-in) accepts messages with a
  magic header; port 8009 (spam-out) retrieves them. Protocol: send
  `SPAM-IN-SPAM-OUT\n<name>\n<flag>\n` to store; `SPAM-IN-SPAM-OUT\n<name>\n`
  to retrieve. Find a vulnerability to intercept other teams' messages.
