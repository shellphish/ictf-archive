description: |
  **iCTF 2005 — The Spam World**

  A web service at `/~spamagent/spamagent.html` that executes submitted XML+Tcl
  agent scripts. The agent format uses `<sender>` credentials and `<code>` with
  Tcl commands; the `store` command persists key-value pairs including the flag.
  Find a way to read other teams' stored values.
