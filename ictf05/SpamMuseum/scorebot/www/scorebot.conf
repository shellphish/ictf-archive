global {
   scriptdir  "/home/ctf/scorebot/scripts";
   logfile    "/home/ctf/scorebot/var/scorebot.log";
   tracefile  "/home/ctf/scorebot/var/scorebot.trace";
   pidfile    "/home/ctf/scorebot/var/scorebot.pid";
   statefile  "/home/www/ctf/var/scorebot.state";
   flaglog    "/home/www/ctf/var/scorebot.flaglog";
   secretkey  "xxxxx";
   decaytime   "190";
   decayfactor "0.92";
}

web {
   chroot "/home/www";
   weblog "/home/www/ctf/var/validate.log";
   debug 1;
}

networkusage {
   script "getusage";  
   roundlength 180;
   penalty 0.05;
}

service "FTP" {
   script "ftpd_setflag.tcl";
   timeout 5.0;
   pittyscore 1;
   defensivescore 3;
   offensivescore 8;
   roundlength 90;
   validityperiod 1;
}

service "Museum" {
   script "museum_bot.py";
   timeout 5.0;
   pittyscore 1;
   defensivescore 3;
   offensivescore 6;
   roundlength 92;
   validityperiod 1;
}

service "Mailer" {
   script "spammer_bot.py";
   timeout 5.0;
   pittyscore 1;
   defensivescore 3;
   offensivescore 6;
   roundlength 94;
   validityperiod 1;
}

service "ORSL" {
   script "orsl_bot.py";
   timeout 5.0;
   pittyscore 1;
   defensivescore 3;
   offensivescore 6;
   roundlength 80;
   validityperiod 1;
}


