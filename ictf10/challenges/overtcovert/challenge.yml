name: "iCTF 2010 — OvertCovert"
author: "Giovanni Vigna / UCSB Security Lab"
category: misc
description: |
  **iCTF 2010 — Hit 'em Where it Hurts**

  OvertCovert (S9) was a steganography/covert-channel service on port 1969.
  Organizers publicly released the source code during the competition to
  encourage teams to analyze it. The service hid information in overt
  communications, requiring teams to find and extract the covert channel.

  Source released during competition; also in `vms/ictf2010.services.tar.gz`.
